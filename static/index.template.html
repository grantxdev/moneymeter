<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>MoneyMeter</title>
<style>
@font-face{font-family:"Instrument Sans";src:url(data:font/woff2;base64,__FONT_N__) format("woff2");font-weight:400 700;font-style:normal;font-display:swap}
@font-face{font-family:"Instrument Sans";src:url(data:font/woff2;base64,__FONT_I__) format("woff2");font-weight:400 700;font-style:italic;font-display:swap}

:root{
  --paper:#FAFAF7; --sunk:#F3F2ED; --card:#FFFFFF; --line:#E9E8E3; --line-soft:#F0EFEB;
  --ink:#1D1D1F; --sub:#6E6E73; --faint:#AEAEB2;
  --up:#34C759; --up-ink:#1E8E3E; --down:#FF3B30; --warn:#FF9500; --warn-ink:#B25E00;
  --act:#007AFF; --teal:#30B0C7; --indigo:#5856D6;
  --shadow:0 1px 2px rgba(29,29,31,.04), 0 4px 16px rgba(29,29,31,.045);
  color-scheme:light;

  /* Fluid type scale — every size interpolates with the viewport, so the layout
     responds continuously instead of snapping at a handful of breakpoints. */
  --t-hero:clamp(38px, 11vw, 58px);   /* the one number a screen is about */
  --t-title:clamp(19px, 4.4vw, 26px); /* every page title, Home's date included */
  --t-stat:clamp(22px, 5.6vw, 28px);  /* a book card's number, a wallet total */
  --t-sec:17px;

  /* Fluid gutters */
  --gutter:clamp(14px, 4vw, 20px);
  --pad-card:clamp(15px, 3.6vw, 18px);

  --tap:44px; /* the smallest thing a thumb should have to hit */
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; background:var(--paper); color:var(--ink);
  font-family:"Instrument Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  font-size:15px; line-height:1.5; -webkit-font-smoothing:antialiased;
}
.tnum{font-variant-numeric:tabular-nums}
h1,h2,h3{margin:0;text-wrap:balance;letter-spacing:-.02em}
p{margin:0}
button{font:inherit;color:inherit}
a{color:var(--act);text-decoration:none}
:focus-visible{outline:2px solid var(--act);outline-offset:2px;border-radius:8px}

/* ---------- shell ---------- */
.topbar{position:sticky;top:0;z-index:20;background:rgba(250,250,247,.92);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);
  padding-left:env(safe-area-inset-left);padding-right:env(safe-area-inset-right)}
.topbar-in{max-width:920px;margin:0 auto;padding:9px var(--gutter);display:flex;align-items:center;gap:3px}
.brand{font-weight:600;font-size:20px;letter-spacing:-.03em;margin-right:18px;flex-shrink:0;color:var(--ink)}
.navscroll{display:flex;align-items:center;gap:3px;min-width:0;overflow-x:auto;scrollbar-width:none}
.navscroll::-webkit-scrollbar{display:none}
/* No pill, no rule. The current page is simply the heaviest word in the bar. */
.navlink{white-space:nowrap;border:0;background:none;padding:0 11px;min-height:var(--tap);
  font-size:14px;font-weight:400;color:var(--sub);cursor:pointer;transition:color .15s}
.navlink:hover{color:var(--ink)}
.navlink[aria-current="page"]{color:var(--ink);font-weight:600}
/* Sign out is not a destination — it sits past a divider and reads quieter. */
.signout{margin-left:auto;flex-shrink:0;border:0;background:none;padding:0 4px 0 14px;min-height:var(--tap);
  border-left:1px solid var(--line);font-size:13px;color:var(--faint);cursor:pointer}
.signout:hover{color:var(--ink)}
.wrap{max-width:920px;margin:0 auto;
  padding:clamp(20px,5vw,34px) var(--gutter) calc(84px + env(safe-area-inset-bottom));
  padding-left:max(var(--gutter),env(safe-area-inset-left));padding-right:max(var(--gutter),env(safe-area-inset-right))}

/* ---------- page headers ---------- */
.phead{margin-bottom:26px}
.phead h1{font-size:var(--t-title);font-weight:600}
.phead .role{color:var(--sub);font-size:14px;margin-top:5px;max-width:60ch}

/* ---------- primitives ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}
.flat{background:var(--card);border:1px solid var(--line);border-radius:16px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:999px;padding:9px 18px;font-size:14px;font-weight:500;border:1px solid transparent;cursor:pointer;transition:background .15s,border-color .15s,color .15s;white-space:nowrap}
.btn-primary{background:var(--ink);color:#fff}
.btn-primary:hover{background:#000}
.btn-ghost{background:var(--card);border-color:var(--line);color:var(--ink)}
.btn-ghost:hover{background:var(--paper)}
.btn-sm{padding:5px 13px;font-size:13px}
.btn-up{background:rgba(52,199,89,.12);color:var(--up-ink)}
.btn-up:hover{background:rgba(52,199,89,.2)}
.btn-down{background:rgba(255,59,48,.1);color:var(--down)}
.btn-down:hover{background:rgba(255,59,48,.18)}
/* padding, not size — the label stays small, the hit area doesn't */
.linkbtn{border:0;background:none;padding:9px 6px;margin:-9px -6px;font-size:13px;color:var(--faint);cursor:pointer}
.linkbtn:hover{color:var(--down)}
.linkbtn.neutral:hover{color:var(--ink)}
.field{width:100%;border:1px solid var(--line);background:var(--paper);border-radius:11px;padding:9px 12px;font-size:14px;font-family:inherit;color:var(--ink)}
.field::placeholder{color:var(--faint)}
.field:focus{outline:none;border-color:rgba(29,29,31,.28);background:var(--card)}
select.field{appearance:none;background-image:url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 12 12'%3E%3Cpath fill='%236E6E73' d='M3 5l3 3 3-3z'/%3E%3C/svg%3E");background-repeat:no-repeat;background-position:right 10px center;padding-right:28px}
textarea.field{resize:vertical;line-height:1.55}
.label{display:block;margin-bottom:5px;font-size:11px;font-weight:500;text-transform:uppercase;letter-spacing:.06em;color:var(--sub)}
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:500}
.p-up{background:rgba(52,199,89,.14);color:var(--up-ink)}
.p-warn{background:rgba(255,149,0,.14);color:var(--warn-ink)}
.p-down{background:rgba(255,59,48,.12);color:var(--down)}
.p-teal{background:rgba(48,176,199,.14);color:#1A7C8C}
.p-mute{background:var(--line-soft);color:var(--sub)}
.sub{color:var(--sub)} .faint{color:var(--faint)}
.tiny{font-size:12px} .small{font-size:13px}
.sec{margin-top:38px}
.sec-h{font-size:var(--t-sec);font-weight:600;margin-bottom:4px}
.sec-r{font-size:13px;color:var(--sub);margin-bottom:14px}
.grid{display:grid;gap:12px}
/* auto-fit, so columns reflow at whatever width they stop fitting rather than
   waiting for a breakpoint someone remembered to write */
.g3{grid-template-columns:repeat(auto-fit,minmax(min(100%,190px),1fr))}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr))}

/* ---------- stat: a label, a number, a line of context ---------- */
.gstat{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr))}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:14px var(--pad-card)}
.stat .label{margin-bottom:3px}
.stat .n{font-size:var(--t-stat);font-weight:600;letter-spacing:-.03em;line-height:1.1}
.stat .why{font-size:12px;color:var(--faint);margin-top:4px;line-height:1.45}
.stat .bar{margin-top:9px}
.stat .kv{display:flex;justify-content:space-between;gap:12px;font-size:13px;padding:2px 0}
.stat .kv span:first-child{color:var(--sub);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* Stacked, a stat is a row: the number belongs beside its label, not under it. */
@media (max-width:439px){
  .stat{display:grid;grid-template-columns:1fr auto;align-items:baseline;column-gap:12px}
  .stat .label{grid-column:1;margin-bottom:0}
  .stat .n{grid-column:2;grid-row:1;text-align:right;font-size:20px}
  .stat .why,.stat .bar,.stat .kv{grid-column:1/-1}
  .stat .why{margin-top:2px}
}
.row{display:flex;align-items:center;gap:12px}
.rowsplit{display:flex;align-items:center;flex-wrap:wrap;gap:10px 12px;padding:12px var(--pad-card);border-top:1px solid var(--line)}
.rowsplit:first-child{border-top:0}
/* the text block claims a whole line before anything is allowed to sit beside it */
.rowsplit .grow{flex:1 1 220px}
.grow{flex:1;min-width:0}
.trunc{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar{height:6px;border-radius:999px;background:var(--line);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:999px;transition:width .4s ease}
details>summary{cursor:pointer;list-style:none;padding:14px 20px;font-size:14px;font-weight:500;user-select:none}
details>summary::-webkit-details-marker{display:none}
details>summary::before{content:"›";display:inline-block;margin-right:8px;color:var(--faint);transition:transform .2s}
details[open]>summary::before{transform:rotate(90deg)}
summary.act{color:var(--act)}
.dbody{padding:0 20px 18px}
.banner{display:flex;gap:8px;border-radius:14px;padding:12px 16px;font-size:14px;margin-bottom:20px;border:1px solid rgba(255,149,0,.3);background:rgba(255,149,0,.09)}
.banner b{color:var(--warn-ink)}
.empty{padding:18px 20px;font-size:13px;color:var(--faint)}

/* ---------- login ---------- */
.login{min-height:88vh;display:flex;align-items:center;justify-content:center;padding:24px}
.login-in{width:100%;max-width:340px}
.login h1{font-size:26px;text-align:center}
.login .tag{text-align:center;color:var(--sub);font-size:14px;margin-top:4px}
.login form{padding:24px;margin-top:28px}
.login .btn{width:100%;margin-top:16px}

/* ---------- home: the card wall ---------- */
.eyebrow{font-size:11px;font-weight:500;text-transform:uppercase;letter-spacing:.08em;color:var(--sub)}
/* Home opens on the three actions — no dateline. Every card states its own
   period, and the wall only ever reads the present one. */
.home-top{margin:0 0 22px;display:flex;align-items:center;gap:14px 16px;flex-wrap:wrap}

/* The three ways money moves. They are the app's primary actions, so they say
   what they do — an unlabelled glyph is a quiz, not a button. */
.acts{display:flex;gap:8px;flex-shrink:0;flex-wrap:wrap}
.actbtn{display:inline-flex;align-items:center;justify-content:center;gap:7px;
  min-height:var(--tap);padding:0 16px;border-radius:999px;border:1px solid var(--line);background:var(--card);
  font-size:14px;font-weight:500;color:var(--ink);cursor:pointer;box-shadow:var(--shadow);white-space:nowrap;
  transition:transform .15s,background .15s,border-color .15s}
.actbtn:hover{background:var(--paper);border-color:rgba(29,29,31,.18);transform:translateY(-1px)}
.actbtn:active{transform:translateY(0)}
.actbtn svg{width:17px;height:17px;flex-shrink:0;stroke-width:2.2;stroke:currentColor;fill:none;stroke-linecap:round;stroke-linejoin:round}
.ib-move svg{color:var(--act)} .ib-out svg{color:var(--down)} .ib-in svg{color:var(--up-ink)}
/* On a phone the row spans the width and splits evenly — three thumb targets. */
@media (max-width:600px){
  .acts{width:100%;gap:7px}
  .actbtn{flex:1 1 0;min-width:0;padding:0 8px;font-size:13px;gap:5px}
}

/* ---------- action sheet ---------- */
.scrim{position:fixed;inset:0;background:rgba(29,29,31,.34);z-index:40;animation:fade .16s ease}
@keyframes fade{from{opacity:0}}
@keyframes rise{from{opacity:0;transform:translate(-50%,-46%)}}
@keyframes slide{from{transform:translateY(100%)}}
.sheet{position:fixed;z-index:41;left:50%;top:50%;transform:translate(-50%,-50%);
  width:min(430px,calc(100vw - 32px));max-height:88vh;overflow-y:auto;
  background:var(--card);border-radius:22px;padding:20px 22px 22px;
  box-shadow:0 24px 64px rgba(29,29,31,.24);animation:rise .2s ease}
.sheet-head{display:flex;align-items:center;gap:10px;margin-bottom:2px}
.sheet-head h2{font-size:17px;font-weight:600;flex:1}
.sheet-x{border:0;background:var(--sunk);width:30px;height:30px;border-radius:999px;font-size:17px;color:var(--sub);cursor:pointer;line-height:1}
.sheet-x:hover{background:var(--line);color:var(--ink)}
.sheet .role{font-size:13px;color:var(--sub)}
.amtbig{display:flex;align-items:baseline;justify-content:center;gap:2px;padding:22px 0 24px}
.amtbig .cur{font-size:30px;font-weight:500;color:var(--faint)}
/* sizes to its content so the $ stays glued to the number; size="4" is the fallback */
.amtbig input{border:0;background:none;font:inherit;font-size:46px;font-weight:600;letter-spacing:-.04em;
  width:auto;min-width:1ch;max-width:min(230px,60vw);text-align:left;padding:0;
  color:var(--ink);font-variant-numeric:tabular-nums;field-sizing:content}
.amtbig input:focus{outline:none}
.amtbig input::placeholder{color:var(--faint)}
.sheet .fset{display:grid;gap:12px}
.sheet .btn{width:100%;margin-top:18px;padding:12px 18px;font-size:15px}
.wall{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(272px,1fr))}
/* A book card doesn't meter the period, it *composes* it: one bar cut into a
   segment per rhythm, and a legend underneath that decodes the bar. A single
   fill would only say how much is gone — this says where it went. */
.bcard{position:relative;background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);
  padding:var(--pad-card);display:flex;flex-direction:column;cursor:pointer;
  transition:transform .15s,box-shadow .15s,border-color .15s}
.bcard:hover{transform:translateY(-2px);border-color:rgba(29,29,31,.15);box-shadow:0 2px 4px rgba(29,29,31,.05),0 10px 26px rgba(29,29,31,.08)}
/* the name is a caption, not a headline — the number is the headline */
.bcard h3{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.09em;
  color:var(--sub);padding-right:20px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bcard .go{position:absolute;top:var(--pad-card);right:var(--pad-card);color:var(--faint);font-size:18px;line-height:1}
.bcard:hover .go{color:var(--ink)}
.bnum{font-size:var(--t-stat);font-weight:600;letter-spacing:-.035em;line-height:1;margin-top:9px}
.bcard .said{font-size:12px;color:var(--faint);margin-top:6px}

/* One continuous bar, squared off and butted together, split by hairlines the
   colour of the card. Rounded pills per segment read as separate objects; this
   reads as one quantity divided up, which is what it is. */
.segbar{display:flex;height:9px;background:var(--sunk);border-radius:3px;overflow:hidden;margin-top:16px}
.segbar>i{display:block;height:100%;min-width:2px;transition:width .4s ease}
.segbar>i+i{border-left:2px solid var(--card)}
.segbar.over{background:rgba(255,59,48,.22)}

/* the legend that decodes it — each swatch is a slice of the bar, stood upright */
.legend{display:flex;flex-direction:column;margin-top:13px}
.lrow{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:10px;padding:4px 0;font-size:13px}
.lrow .dot{width:4px;height:15px;border-radius:2px;flex-shrink:0}
.lrow .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lrow .v{color:var(--sub);white-space:nowrap}
.lrow.is-over .v{color:var(--down);font-weight:500}
.lrow.rest .nm,.lrow.rest .v{color:var(--faint)}
.lrow.rest .dot{box-shadow:inset 0 0 0 1px var(--line)}
/* the quick log sits *in* the card, sunk into it */
.qa{display:flex;gap:6px;background:var(--sunk);border:1px solid var(--line);border-radius:12px;padding:6px}
.qa input,.qa select{border:1px solid transparent;background:var(--card);border-radius:8px;font:inherit;font-size:13px;padding:6px 9px;min-width:0;color:var(--ink)}
.qa input:focus,.qa select:focus{outline:none;border-color:rgba(29,29,31,.28)}
.qa .amt{width:78px;flex-shrink:0}
.qa select{flex:1;min-width:0;appearance:none}
.qa button{flex-shrink:0;border:0;background:var(--ink);color:#fff;border-radius:8px;padding:6px 11px;font-size:13px;font-weight:500;cursor:pointer}
.backlink{border:0;background:none;padding:0;font-size:13px;color:var(--sub);cursor:pointer;margin-bottom:16px}
.backlink:hover{color:var(--ink)}
/* Name and figure are the pair that matters, so they share a line at every
   width; the bar takes the rest of the row and never floats mid-air. */
.rhythmline{display:grid;grid-template-columns:1fr minmax(90px,auto);align-items:baseline;
  column-gap:12px;row-gap:6px;padding:9px 0;border-bottom:1px solid var(--line-soft)}
.rhythmline:last-child{border-bottom:0}
.rhythmline .nm{font-size:14px}
.rhythmline .fig{text-align:right;white-space:nowrap}
.rhythmline .bar{grid-column:1/-1;width:100%;height:5px}
.cled{display:flex;align-items:center;gap:9px;padding:6px 0;font-size:13px}
.cled .d{width:44px;flex-shrink:0;font-size:11px;color:var(--faint)}

/* ---------- one book's week ---------- */
.wk{max-width:540px;margin:0 auto}
.switch{display:flex;align-items:center;gap:6px;margin-bottom:26px}
.sw-name{flex:1;text-align:center;min-width:0}
.sw-name b{display:block;font-size:17px;font-weight:600;letter-spacing:-.01em}
.sw-arrow{width:var(--tap);height:var(--tap);flex-shrink:0;border-radius:999px;border:1px solid var(--line);
  background:var(--card);color:var(--sub);font-size:17px;line-height:1;cursor:pointer}
.sw-arrow:hover{background:var(--paper);color:var(--ink)}
.wk-top{text-align:center}
.bignum{font-size:var(--t-hero);font-weight:600;letter-spacing:-.045em;line-height:1.05;margin-top:12px}
/* the log bar sits *in* the paper, not on a white card */
.quick{background:var(--sunk);border:1px solid var(--line);border-radius:18px;padding:12px;margin-top:30px;display:flex;flex-direction:column;gap:10px}
.quick-top{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 14px}
.quick-top input{border:0;background:none;font:inherit;font-size:15px;padding:0;min-width:0;width:100%}
.quick-top input:focus{outline:none}
.quick-top input::placeholder{color:var(--faint)}
.quick-top .cur{color:var(--faint);font-size:15px}
.quick-row{display:flex;gap:8px}
.quick-row select{flex:1;min-width:0}
/* ---------- bulk entry ---------- */
.brow{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,140px),1fr));gap:8px;align-items:center;margin-bottom:8px}
.brow .amt{max-width:140px}

/* ---------- rhythms ---------- */
.rcard{padding:16px 18px;display:flex;flex-direction:column;gap:11px}
.rtop{display:flex;align-items:flex-start;gap:10px}
.rname{font-size:15px;font-weight:600;letter-spacing:-.01em}
.rmeta{font-size:12px;color:var(--faint);margin-top:1px}
.rfig{margin-left:auto;text-align:right;flex-shrink:0}
.rfig .n{font-size:15px;font-weight:600}
.strip{display:flex;gap:3px;align-items:center}
.strip i{width:14px;height:6px;border-radius:2px;background:var(--line);display:block}
.strip i.ok{background:var(--up)}
.strip i.miss{background:var(--down)}
.strip i.now{background:var(--line);outline:1px solid var(--faint);outline-offset:1px}
.cadhead{display:flex;align-items:baseline;gap:10px;margin:28px 0 12px}
.cadhead h3{font-size:14px;font-weight:600;text-transform:uppercase;letter-spacing:.07em}
.cadhead .t{margin-left:auto;font-size:13px;color:var(--sub)}

/* ---------- segmented ---------- */
.seg{display:inline-flex;background:var(--sunk);border-radius:999px;padding:3px;gap:2px}
.seg button{border:0;background:none;padding:6px 15px;border-radius:999px;font-size:13px;font-weight:500;color:var(--sub);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--ink);box-shadow:0 1px 2px rgba(29,29,31,.08)}

/* ---------- ledger ---------- */
.led{display:flex;align-items:center;gap:12px;padding:10px 20px;border-top:1px solid var(--line);font-size:14px}
.led:first-child{border-top:0}
.led .d{width:52px;flex-shrink:0;font-size:12px;color:var(--faint)}
.tag{font-size:11px;color:var(--sub);background:var(--line-soft);border-radius:999px;padding:2px 8px;margin-left:6px;white-space:nowrap}

/* ---------- chart ---------- */
.chartbox{position:relative}
.chartbox svg{width:100%;display:block;touch-action:none}
/* Below ~600px the 640-unit viewBox squeezes the axis labels past legibility.
   Scroll the plot at a readable size instead of shrinking it into noise —
   "View as table" underneath stays the accessible route either way. */
@media (max-width:600px){
  .chartbox{overflow-x:auto;scrollbar-width:thin}
  .chartbox svg{min-width:560px}
  .chartbox .tip{display:none!important}
}
.charthead{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:2px 12px;margin-bottom:6px}
.charthead h3{font-size:15px;font-weight:600}
.tip{position:absolute;top:6px;pointer-events:none;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:9px 12px;font-size:12px;box-shadow:var(--shadow);white-space:nowrap;display:none}
.tip h4{margin:0 0 5px;font-size:12px;font-weight:600}
.tip .r{display:flex;align-items:center;gap:8px;margin-top:3px}
.tip .dot{width:7px;height:7px;border-radius:999px;flex-shrink:0}

<div id="app"></div>

<script>
"use strict";
/* Six digits, typed on a number pad. Not a secret — it ships in this file —
   only a door that stays shut to whoever wanders past. */
const PASSCODE = "314159";
const KEY = "moneymeter.db.v2";
const SESS = "moneymeter.authed";

/* ============ money & dates ============ */
const c2 = n => String(n).padStart(2,"0");
function money(cents){
  const s = cents < 0 ? "−" : "", a = Math.abs(cents), d = Math.floor(a/100), r = a%100;
  return s + "$" + d.toLocaleString("en-US") + (r ? "." + c2(r) : "");
}
function parseMoney(v){
  if(!v) return 0;
  const n = parseFloat(String(v).replace(/[$,\s]/g,""));
  return isFinite(n) ? Math.round(n*100) : 0;
}
function iso(d){ return d.getFullYear()+"-"+c2(d.getMonth()+1)+"-"+c2(d.getDate()); }
function fromIso(s){ const [y,m,d]=s.split("-").map(Number); return new Date(y,m-1,d); }
function pretty(s){ return fromIso(s).toLocaleDateString("en-US",{month:"short",day:"numeric"}); }
function weekStart(d){ const x=new Date(d); const k=(x.getDay()+6)%7; x.setDate(x.getDate()-k); x.setHours(0,0,0,0); return x; }
function addDays(d,n){ return new Date(d.getTime()+n*86400000); }
function today(){ const d=new Date(); d.setHours(0,0,0,0); return d; }
const uid = () => Math.random().toString(36).slice(2,10);

/* ============ cadence periods ============ */
const CADENCES = ["weekly","monthly","quarterly","annual"];
const CAD_LABEL = {weekly:"Weekly", monthly:"Monthly", quarterly:"Quarterly", annual:"Annual"};
const CAD_UNIT = {weekly:"week", monthly:"month", quarterly:"quarter", annual:"year"};

function periodStart(cad, d){
  const t = new Date(d);
  if(cad==="weekly") return weekStart(t);
  if(cad==="monthly") return new Date(t.getFullYear(), t.getMonth(), 1);
  if(cad==="quarterly") return new Date(t.getFullYear(), Math.floor(t.getMonth()/3)*3, 1);
  return new Date(t.getFullYear(), 0, 1);
}
function periodEnd(cad, s){
  if(cad==="weekly") return addDays(s,6);
  if(cad==="monthly") return new Date(s.getFullYear(), s.getMonth()+1, 0);
  if(cad==="quarterly") return new Date(s.getFullYear(), s.getMonth()+3, 0);
  return new Date(s.getFullYear(), 11, 31);
}
function prevPeriod(cad, s){
  if(cad==="weekly") return addDays(s,-7);
  if(cad==="monthly") return new Date(s.getFullYear(), s.getMonth()-1, 1);
  if(cad==="quarterly") return new Date(s.getFullYear(), s.getMonth()-3, 1);
  return new Date(s.getFullYear()-1, 0, 1);
}
function periodLabel(cad, s){
  if(cad==="weekly") return pretty(iso(s));
  if(cad==="monthly") return s.toLocaleDateString("en-US",{month:"short"});
  if(cad==="quarterly") return "Q" + (Math.floor(s.getMonth()/3)+1);
  return String(s.getFullYear());
}

/* ============ state ============ */
let db = null, route = "home", banner = "", authed = false, entryKind = "expense";
let sheet = null; // {kind, bookId} — the open action sheet, or null
const STAGE_LABEL = {seeded:"Seeded",probation:"On probation","self-funding":"Self-funding",contributing:"Contributing","wound-down":"Wound down"};
const STAGE_CLS = {seeded:"p-warn",probation:"p-warn","self-funding":"p-teal",contributing:"p-up","wound-down":"p-mute"};
const openIds = new Set();

function save(){ try{ localStorage.setItem(KEY, JSON.stringify(db)); }catch(e){} }
function load(){ try{ const r = localStorage.getItem(KEY); if(r) return JSON.parse(r); }catch(e){} return null; }

/* ============ rhythms — the habit layer ============ */
function rhythmsFor(bookId, cad){
  return db.rhythms.filter(r => !r.archived && (!bookId || r.bookId===bookId) && (!cad || r.cadence===cad));
}
function rhythmSpent(r, startD){
  const s = iso(startD), e = iso(periodEnd(r.cadence, startD));
  let sum = 0;
  for(const t of db.transactions)
    if(t.rhythmId===r.id && t.kind==="expense" && t.date>=s && t.date<=e) sum += t.amount;
  return sum;
}
function met(r, spent){ return r.type==="fixed" ? spent >= r.amount : spent <= r.amount; }

/* ============ expected dates ============
   A rhythm coarser than a week falls on a day, not merely "sometime this
   month". Monthly carries a day of the month; quarterly a month-of-quarter
   (1–3) plus a day; annual a calendar month (1–12) plus a day. Absent values
   mean the first. This is what keeps rent off every week's board. */
function clampInt(n, lo, hi){ n = parseInt(n,10); if(!isFinite(n)) n = lo; return Math.min(Math.max(n,lo),hi); }
function daysInMonth(y, m){ return new Date(y, m+1, 0).getDate(); }
function dueDateFor(r, ps){
  if(r.cadence==="weekly") return null;
  const y = ps.getFullYear();
  let m = ps.getMonth();
  if(r.cadence==="quarterly") m += clampInt(r.dueMonth,1,3) - 1;
  else if(r.cadence==="annual") m = clampInt(r.dueMonth,1,12) - 1;
  return new Date(y, m, Math.min(clampInt(r.dueDay,1,31), daysInMonth(y,m)));
}
/** Its expected date in whichever period the given day belongs to. */
function dueDateOn(r, d){ return dueDateFor(r, periodStart(r.cadence, d || today())); }
/** Does its expected date land inside the week beginning ws? Both ends of the
    week are checked, so a period boundary falling mid-week — a new year, a
    quarter turning — can never hide the thing that is due. */
function dueInWeek(r, ws){
  if(r.cadence==="weekly") return true;
  const we = addDays(ws,6);
  for(const anchor of [ws, we]){
    const d = dueDateFor(r, periodStart(r.cadence, anchor));
    if(d && d>=ws && d<=we) return true;
  }
  return false;
}
function ord(n){ const s=["th","st","nd","rd"], v=n%100; return n+(s[(v-20)%10]||s[v]||s[0]); }
function dueLabel(r, d){
  if(r.cadence==="weekly") return "every week";
  if(r.cadence==="monthly") return "due the "+ord(clampInt(r.dueDay,1,31));
  const md = dueDateOn(r, d).toLocaleDateString("en-US",{month:"short",day:"numeric"});
  return r.cadence==="quarterly" ? "due "+md+", each quarter" : "due "+md;
}

/* ============ reserves — the set-aside behind an obligation ============
   Rent is monthly and simply paid. An annual premium is not: it is carried a
   twelfth at a time and settled once, on its date. A reserved obligation
   accrues one contribution per month from the day it was set and is drawn
   down by what is charged to it. The accrual says what should have been put
   aside; the shortfall flag is what keeps that honest. */
const CAD_MONTHS = {weekly:0, monthly:1, quarterly:3, annual:12};
function contribMonthly(r){ return Math.round(r.amount / (CAD_MONTHS[r.cadence] || 1)); }
function monthsBetween(a, b){ return (b.getFullYear()-a.getFullYear())*12 + (b.getMonth()-a.getMonth()); }
/** A reserve only makes sense for an obligation you cannot skip, on a beat
    slower than the month you fund it from. */
function isReserved(r){ return !!r.reserve && r.type==="fixed" && (r.cadence==="quarterly" || r.cadence==="annual"); }
function reserveState(r, d){
  const now = d || today(), start = fromIso(r.start), contrib = contribMonthly(r);
  let drawn = 0;
  for(const t of db.transactions)
    if(t.rhythmId===r.id && t.kind==="expense" && t.date>=r.start) drawn += t.amount;
  // Once this period's date has gone by, the question is about the next one —
  // a shortfall you can still do something about, not one already behind you.
  let due = dueDateOn(r, now);
  if(due < now) due = dueDateFor(r, addDays(periodEnd(r.cadence, periodStart(r.cadence, now)), 1));
  const held = contrib * (monthsBetween(start, now) + 1) - drawn;
  const atDue = contrib * (monthsBetween(start, due) + 1) - drawn;
  return {contrib, due, held, atDue, short: Math.max(0, r.amount - atDue)};
}

/** Completed periods, newest first, bounded by when the rhythm was set. */
function completedPeriods(r, max){
  const out = [];
  let p = prevPeriod(r.cadence, periodStart(r.cadence, today()));
  for(let i=0;i<max;i++){
    if(iso(p) < r.start) break; // a period already underway when the rhythm was set isn't judged
    out.push(p);
    p = prevPeriod(r.cadence, p);
  }
  return out;
}
function rhythmStreak(r){
  let n = 0;
  for(const p of completedPeriods(r, 60)){
    if(!met(r, rhythmSpent(r,p))) break;
    n++;
  }
  return n;
}
/** "Consistently overspent" → this rhythm has earned a review at the board meeting. */
function rhythmReview(r){
  const ps = completedPeriods(r, 4);
  if(ps.length < 3) return null;
  const missed = ps.filter(p => !met(r, rhythmSpent(r,p))).length;
  return missed / ps.length >= 0.6 ? {missed, of: ps.length} : null;
}
function historyStrip(r, n){
  const ps = completedPeriods(r, n).reverse();
  let h = ps.map(p => '<i class="' + (met(r, rhythmSpent(r,p)) ? "ok" : "miss") + '" title="' + periodLabel(r.cadence,p) + ' · ' + money(rhythmSpent(r,p)) + '"></i>').join("");
  h += '<i class="now" title="this ' + CAD_UNIT[r.cadence] + ', still open"></i>';
  return '<span class="strip">' + h + '</span>';
}
/** The rhythms a period actually answers for. A weekly book answers for its
    weekly rhythms always, and for a coarser obligation only in the week its
    expected date lands — rent belongs to the week rent is due, not to all
    four. Anything on a slower beat answers for its own cadence alone. */
function rhythmsInPlay(bookId, cad, d){
  const own = rhythmsFor(bookId, cad);
  if(cad !== "weekly") return own;
  const ws = periodStart("weekly", d || today());
  return own.concat(db.rhythms.filter(r => !r.archived && (!bookId || r.bookId===bookId)
    && r.cadence !== "weekly" && dueInWeek(r, ws)));
}
/** A reserved obligation was funded a month at a time; when its date comes it
    is settled out of that reserve, so it must not land on the period's number
    a second time. It still shows — it is just already paid for. */
function countsToward(r){ return !isReserved(r); }

/** The number is not declared — it is the sum of the rhythms in play. */
function periodNumber(bookId, cad, d){
  return rhythmsInPlay(bookId, cad, d).filter(countsToward).reduce((s,r)=> s + r.amount, 0);
}
function weeklyNumber(bookId){ return periodNumber(bookId, "weekly"); }

/** A book runs on the finest beat it actually keeps. Personal is weekly; a
    venture whose rhythms are payroll and tax set-aside is monthly. */
function bookCadence(bookId){
  for(const c of CADENCES) if(rhythmsFor(bookId, c).length) return c;
  return "weekly";
}
function periodSpend(bookId, cad, d){
  const ps = periodStart(cad, d);
  const s = iso(ps), e = iso(periodEnd(cad, ps));
  const ids = new Set(rhythmsInPlay(bookId, cad, d).filter(countsToward).map(r=>r.id));
  let sum = 0;
  for(const t of db.transactions){
    if(t.bookId!==bookId || t.kind!=="expense" || t.wallet!=="operating") continue;
    if(t.date < s || t.date > e || t.projectId) continue;
    if(t.rhythmId && !ids.has(t.rhythmId)) continue; // other cadences aren't this period's business
    sum += t.amount;
  }
  return sum;
}
function weekSpend(bookId, d){ return periodSpend(bookId, "weekly", d); }
/** "The week of Aug 10 – Aug 16", "August", "Q3 2026", "2026". */
function periodRange(cad, ps){
  if(cad==="weekly") return "The week of "+pretty(iso(ps))+" – "+pretty(iso(addDays(ps,6)));
  if(cad==="monthly") return ps.toLocaleDateString("en-US",{month:"long",year:"numeric"});
  if(cad==="quarterly") return "Q"+(Math.floor(ps.getMonth()/3)+1)+" "+ps.getFullYear();
  return String(ps.getFullYear());
}

/* ============ money math ============ */
function balances(bookId, asOf){
  const b = {operating:0,buffer:0,wealth:0};
  for(const t of db.transactions){
    if(t.bookId!==bookId) continue;
    if(asOf && t.date > asOf) continue;
    if(t.kind==="income") b[t.wallet] += t.amount;
    else if(t.kind==="expense") b[t.wallet] -= t.amount;
    else if(t.kind==="transfer" && t.toWallet){ b[t.wallet]-=t.amount; b[t.toWallet]+=t.amount; }
  }
  return b;
}
function projectBalance(p){
  let funded=0, spent=0;
  for(const t of db.transactions){
    if(t.projectId!==p.id) continue;
    if(t.kind==="expense") spent+=t.amount; else funded+=t.amount;
  }
  return {funded, spent};
}
function bookIncome(bookId,s,e){
  let n=0;
  for(const t of db.transactions) if(t.bookId===bookId&&t.kind==="income"&&t.date>=s&&t.date<=e) n+=t.amount;
  return n;
}
function runway(book){
  if(!book.monthlyBurn || book.monthlyBurn<=0) return Infinity;
  return balances(book.id).buffer / book.monthlyBurn;
}
/** Monthly burn implied by the book's own fixed rhythms. */
function impliedBurn(bookId){
  let n = 0;
  for(const r of rhythmsFor(bookId)){
    if(r.type!=="fixed") continue;
    n += r.cadence==="weekly" ? r.amount*52/12 : r.cadence==="monthly" ? r.amount
       : r.cadence==="quarterly" ? r.amount/3 : r.amount/12;
  }
  return Math.round(n);
}
function quarterInfo(){
  const t=today(), y=t.getFullYear(), q=Math.floor(t.getMonth()/3)+1;
  return {y,q,label:"Q"+q+" "+y,start:iso(new Date(y,(q-1)*3,1)),end:iso(new Date(y,q*3,0))};
}

/* ============ helpers ============ */
const esc = s => String(s==null?"":s).replace(/[&<>"']/g, m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
const dec = c => c ? (c/100).toString() : "";
const bookName = id => (db.books.find(b=>b.id===id)||{}).name || "";
const rhythmName = id => (db.rhythms.find(r=>r.id===id)||{}).name || "";
function det(id, summary, body, action, containerCls, summaryCls){
  return '<details class="'+(containerCls||"")+'" data-id="'+id+'"'+(openIds.has(id)?" open":"")+'>'+
    '<summary'+(summaryCls?' class="'+summaryCls+'"':"")+'>'+summary+'</summary>'+
    '<form class="dbody" data-a="'+action+'">'+body+'</form></details>';
}
function go(r){ route=r; banner=""; render(true); }
function fail(m){ banner=m; render(); }
function phead(title, role){
  return '<div class="phead"><h1>'+title+'</h1><p class="role">'+role+'</p></div>';
}
function rhythmOptions(bookId, cad, selected){
  const rs = rhythmsInPlay(bookId, cad);
  return rs.map(r=>'<option value="'+r.id+'"'+(selected===r.id?" selected":"")+'>'+esc(r.name)+' · '+money(r.amount)+'/'+CAD_UNIT[r.cadence]+'</option>').join("");
}

/* ============ views ============ */
function loginView(){
  return '<div class="login"><div class="login-in">'+
    '<h1>MoneyMeter</h1>'+
    '<form class="card" data-a="login" style="margin-top:22px">'+
      '<label class="label" for="pw">Passcode</label>'+
      '<input class="field tnum" id="pw" name="passcode" type="password" autofocus placeholder="6 digits" '+
        'inputmode="numeric" pattern="[0-9]*" maxlength="6" autocomplete="one-time-code" '+
        'style="text-align:center;letter-spacing:.4em;font-size:20px">'+
      (banner?'<p class="small" style="color:var(--down);margin-top:8px">'+esc(banner)+'</p>':"")+
      '<button class="btn btn-primary">Enter</button></form>'+
    '<p class="tiny faint" style="text-align:center;margin-top:22px">Private instance — one seat at this table.</p>'+
  '</div></div>';
}

/* Three items, always. Books are reached by tapping a card, so ten ventures
   never wrap the bar. */
function navView(){
  const links = [{r:"home",l:"Home"},{r:"constitution",l:"Constitution"},{r:"meeting",l:"Board Meeting"}];
  const cur = (route.startsWith("book:") || route.startsWith("week:")) ? "home" : route;
  const btn = x => '<button class="navlink" data-go="'+x.r+'"'+(cur===x.r?' aria-current="page"':"")+'>'+esc(x.l)+'</button>';
  // the destinations scroll if they must; Sign out stays put and never gets
  // pushed off the edge with them
  return '<header class="topbar"><div class="topbar-in">'+
    '<button class="brand" style="border:0;background:none;padding:0;cursor:pointer" data-go="home">MoneyMeter</button>'+
    '<nav class="navscroll">'+links.map(btn).join("")+'</nav>'+
    '<button class="signout" data-a="logout">Sign out</button></div></header>';
}

/* The three ways money moves, wherever they appear. Each button carries its
   word: Spend / Receive / Move. The glyph is decoration, the label is the
   affordance — nobody should have to guess what "⇄" charges. */
const ACT_ICON = {
  move:'<path d="M4 8h13M13 4l4 4-4 4M17 15H4M8 11l-4 4 4 4"/>',
  out:'<path d="M4 10h12"/>',
  in:'<path d="M10 4v12M4 10h12"/>'
};
const ACTIONS = [
  {k:"move", kind:"transfer", label:"Move",    hint:"Move money between wallets"},
  {k:"out",  kind:"expense",  label:"Spend",   hint:"Log a spend"},
  {k:"in",   kind:"income",   label:"Receive", hint:"Record money received"}
];
function actionRow(bookId, style){
  const b = bookId ? ' data-book="'+bookId+'"' : "";
  return '<div class="acts"'+(style?' style="'+style+'"':"")+'>'+ ACTIONS.map(a=>
    '<button class="actbtn ib-'+a.k+'" data-a="opensheet" data-v="'+a.kind+'"'+b+' title="'+a.hint+'">'+
      '<svg viewBox="0 0 20 20" aria-hidden="true">'+ACT_ICON[a.k]+'</svg>'+a.label+'</button>').join("")+'</div>';
}

/* ---- Home: the card wall. Every book is a card; every book has a week. ---- */
function homeView(){
  const t = today();
  const books = db.books.filter(b=>b.stage!=="wound-down");
  const anyWeekly = books.some(b=>rhythmsFor(b.id).length > 0);

  const empty = anyWeekly ? "" :
    '<div class="flat" style="margin-bottom:20px;padding:20px;font-size:14px;color:var(--sub)">'+
      'No rhythms yet. No book’s number is declared — each is the sum of the rhythms you set for it. Open a book to set its first one.</div>';

  return '<div class="home-top">'+ actionRow() +'</div>'+
    empty +
    '<div class="wall">'+books.map(b=>bookCard(b,t)).join("")+'</div>'+
    '<p class="tiny faint" style="margin-top:44px;text-align:center;line-height:1.6">'+
      'Tap a card to open its book. Each book holds its own rhythms; the board meeting holds the questions.</p>';
}

/* A line reads against its own period, not the page's — a monthly obligation
   surfacing in the week it falls due is still measured across its month. */
function rhythmRow(r, t){
  const s = rhythmSpent(r, periodStart(r.cadence, t));
  const p = r.amount>0 ? Math.min(100, Math.round(s/r.amount*100)) : 0;
  const o = s > r.amount;
  const when = r.cadence==="weekly" ? "" : ' <span class="faint">· '+dueLabel(r,t)+'</span>';
  return '<div class="rhythmline"><span class="nm trunc">'+esc(r.name)+when+'</span>'+
    '<span class="fig tnum small'+(o?'" style="color:var(--down)':"")+'">'+money(s)+
      '<span class="faint"> / '+money(r.amount)+'</span></span>'+
    '<span class="bar"><i style="width:'+(o?100:p)+'%;background:'+(o?"var(--down)":p>=85?"var(--warn)":"var(--up)")+'"></i></span></div>';
}

/* Segment colours. Deliberately none of the state colours — green and red mean
   "holding" and "over" everywhere else in this app, and a category that merely
   happens to be third in the list must not borrow that meaning. Ordered so
   neighbouring segments sit far apart in hue. */
const SEG_COLORS = ["#7FB8F5","#F49CC0","#6FC9D8","#F5B978","#A5A1E6","#C79BD8"];
const SEG_OTHER = "#C9C7C1";

/* Where the period actually went: one entry per rhythm that was charged, plus
   whatever was spent outside them all. Mirrors periodSpend()'s filter exactly,
   so the segments always sum to the number on the card. */
function bookSegments(bookId, cad, d){
  const ps = periodStart(cad, d);
  const s = iso(ps), e = iso(periodEnd(cad, ps));
  const rs = rhythmsInPlay(bookId, cad, d).filter(countsToward);
  const idx = new Map(rs.map((r,i)=>[r.id,i]));
  const sums = rs.map(()=>0);
  let loose = 0;
  for(const t of db.transactions){
    if(t.bookId!==bookId || t.kind!=="expense" || t.wallet!=="operating") continue;
    if(t.date < s || t.date > e || t.projectId) continue;
    if(t.rhythmId){
      if(!idx.has(t.rhythmId)) continue; // another cadence's business
      sums[idx.get(t.rhythmId)] += t.amount;
    } else loose += t.amount;
  }
  // colour is keyed to the rhythm's own position, so it doesn't change hue
  // when the sort order shifts week to week
  const out = rs.map((r,i)=>({name:r.name, amount:sums[i], cap:r.amount, color:SEG_COLORS[i%SEG_COLORS.length]}))
                .filter(x=>x.amount>0);
  if(loose>0) out.push({name:"One-off", amount:loose, cap:0, color:SEG_OTHER});
  return out.sort((a,c)=> c.amount-a.amount);
}

/* One book, at a glance. Name, what's left, where the period went — and the
   whole card is the way in. */
function bookCard(b, t){
  const cad = bookCadence(b.id);
  const num = periodNumber(b.id, cad, t), spent = periodSpend(b.id, cad, t);
  const left = num - spent, over = left < 0;
  const set = num > 0;

  // Name and reading on one line; what the reading means underneath it.
  // caption, then the number, then what the number means — read top to bottom
  const head = '<h3>'+esc(b.name)+'</h3>'+
    '<span class="go" aria-hidden="true">›</span>'+
    (set
      ? '<p class="bnum tnum"'+(over?' style="color:var(--down)"':"")+'>'+money(Math.abs(left))+'</p>'
      : '<p class="bnum tnum faint">—</p>')+
    '<p class="said">'+(set
      ? (over ? money(spent)+' spent — over this '+CAD_UNIT[cad]
              : money(spent)+' of '+money(num)+' this '+CAD_UNIT[cad])
      : 'no rhythms set')+'</p>';

  if(!set) return '<div class="bcard" data-go="week:'+b.id+'" role="button" tabindex="0" '+
    'aria-label="Open '+esc(b.name)+'">'+head+
    '<p class="tiny faint" style="margin-top:16px">Its number is the sum of its rhythms. Open it to set the first one.</p></div>';

  const segs = bookSegments(b.id, cad, t);
  // over the number, the bar is scaled to what was actually spent, so the
  // proportions stay honest even once the track has run out
  const denom = Math.max(num, spent, 1);
  const bar = '<div class="segbar'+(over?" over":"")+'" role="img" aria-label="'+
      esc(segs.map(s=>s.name+" "+money(s.amount)).join(", ") || "nothing logged")+'">'+
    segs.map(s=>'<i style="width:'+(s.amount/denom*100).toFixed(2)+'%;background:'+s.color+'"></i>').join("")+
  '</div>';

  const MAXL = 4;
  const shown = segs.slice(0,MAXL), rest = segs.slice(MAXL);
  const lrow = (color,name,amount,cls) =>
    '<div class="lrow'+(cls?" "+cls:"")+'"><span class="dot" style="background:'+color+'"></span>'+
    '<span class="nm">'+esc(name)+'</span><span class="v tnum">'+money(amount)+'</span></div>';

  let legend = shown.map(s=>lrow(s.color, s.name, s.amount, s.cap>0 && s.amount>s.cap ? "is-over" : "")).join("");
  if(rest.length) legend += lrow("var(--line)", rest.length+" more", rest.reduce((a,c)=>a+c.amount,0), "rest");
  // the unfilled track, named — the legend accounts for the whole bar
  if(!over) legend += lrow("var(--sunk)", "Left", left, "rest");

  return '<div class="bcard" data-go="week:'+b.id+'" role="button" tabindex="0" aria-label="Open '+esc(b.name)+'">'+
    head + bar +
    (segs.length ? '<div class="legend">'+legend+'</div>'
                 : '<p class="tiny faint" style="margin-top:13px">Nothing logged this '+CAD_UNIT[cad]+' yet.</p>')+
  '</div>';
}

/* ---- One book's period: the old home, scoped, on that book's own beat ---- */
function weekBookView(id){
  const books = db.books.filter(b=>b.stage!=="wound-down");
  const i = books.findIndex(b=>b.id===id);
  if(i < 0) return '<p class="sub">That book is gone. <button class="linkbtn neutral" data-go="home" style="color:var(--act)">All books \u2192</button></p>';
  const book = books[i], t = today();
  const cad = bookCadence(book.id), ps = periodStart(cad, t), unit = CAD_UNIT[cad];
  const prev = books[(i - 1 + books.length) % books.length];
  const next = books[(i + 1) % books.length];

  const num = periodNumber(book.id, cad), spent = periodSpend(book.id, cad, t);
  const left = num - spent, over = left < 0;
  const pct = num>0 ? Math.min(100, Math.round(spent/num*100)) : 0;
  const inplay = rhythmsInPlay(book.id, cad, t);
  const lines_r = inplay.filter(countsToward);
  const reserved = inplay.filter(isReserved);

  const arrow = (b,g,l) => '<button class="sw-arrow" data-go="week:'+b.id+'" aria-label="'+l+'">'+g+'</button>';
  const switcher = '<div class="switch">'+
    (books.length>1 ? arrow(prev,"\u2039","Previous book") : '<span style="width:36px"></span>')+
    '<div class="sw-name"><b class="trunc">'+esc(book.name)+'</b>'+
      '<span class="tiny faint">'+(i+1)+' of '+books.length+'</span></div>'+
    (books.length>1 ? arrow(next,"\u203a","Next book") : '<span style="width:36px"></span>')+
  '</div>';

  // the same three actions as home, already pointed at this book
  const actions = actionRow(book.id, "justify-content:center;margin-top:22px");

  let head;
  if(num > 0){
    const col = over ? "var(--down)" : pct>=85 ? "var(--warn)" : "var(--up)";
    head = '<p class="bignum tnum"'+(over?' style="color:var(--down)"':"")+'>'+money(Math.abs(left))+'</p>'+
      '<p class="small sub" style="margin-top:6px">'+(over
        ? '<span style="color:var(--down);font-weight:500">over the '+unit+'\u2019s rhythms</span>'
        : 'left of <b class="tnum" style="color:var(--ink)">'+money(num)+'</b>')+'</p>'+
      '<div class="bar" style="width:220px;margin:20px auto 0"><i style="width:'+(over?100:pct)+'%;background:'+col+'"></i></div>';
  } else {
    head = '<div class="flat" style="margin-top:22px;padding:20px;font-size:14px;color:var(--sub);text-align:left">'+
      'No rhythms on this book. Its number isn\u2019t declared \u2014 it\u2019s the sum of the rhythms you set for it. '+
      '<button class="linkbtn neutral" data-go="book:'+book.id+'" style="color:var(--act)">Set them on this book \u2192</button></div>';
  }

  const quick = lines_r.length ? '<form class="quick" data-a="quicklog">'+
      '<input type="hidden" name="bookId" value="'+book.id+'">'+
      '<div class="quick-top"><span class="cur">$</span>'+
      '<input class="tnum" name="amount" inputmode="decimal" placeholder="0.00" required autocomplete="off" aria-label="Amount"></div>'+
      '<div class="quick-row">'+
        '<select class="field" name="rhythmId" required>'+
          '<option value="">Which rhythm?</option>'+ rhythmOptions(book.id, cad) +
          '<option value="__none">One-off \u2014 outside the rhythms</option>'+
        '</select>'+
        '<input class="field" name="note" placeholder="Note (optional)" style="flex:1">'+
        '<button class="btn btn-primary">Log it</button>'+
      '</div></form>' : "";

  const lines = lines_r.length ? '<div class="sec">'+
    '<p class="eyebrow" style="margin-bottom:6px">This '+unit+'\u2019s rhythms</p>'+
    lines_r.map(r=>rhythmRow(r, t)).join("")+'</div>' : "";

  // Settled out of its own reserve \u2014 named here so the week can see what is
  // landing, but kept off the number, which the monthly set-asides already met.
  const held = reserved.length ? '<div class="sec">'+
    '<p class="eyebrow" style="margin-bottom:6px">Due this '+unit+' \u2014 from its reserve</p>'+
    '<div class="flat">'+reserved.map(r=>{
      const rs = reserveState(r, t);
      return '<div class="led"><span class="d">'+pretty(iso(rs.due))+'</span>'+
        '<span class="grow trunc">'+esc(r.name)+'<span class="tag">'+money(rs.contrib)+'/mo set aside</span></span>'+
        '<span class="tnum">'+money(r.amount)+'</span>'+
        (rs.short>0 ? '<span class="pill p-down">'+money(rs.short)+' short</span>' : '<span class="pill p-up">covered</span>')+
      '</div>';
    }).join("")+'</div>'+
    '<p class="tiny faint" style="margin-top:7px">It has been carried a month at a time, so it does not come out of this '+unit+'\u2019s number.</p></div>' : "";

  const logged = db.transactions
    .filter(x=>x.bookId===book.id && x.kind==="expense" && x.wallet==="operating" && !x.projectId && x.date>=iso(ps))
    .sort((a,b2)=> a.date<b2.date?1:-1);
  const list = logged.length ? '<div class="sec"><p class="eyebrow" style="margin-bottom:6px">Logged this '+unit+'</p>'+
    '<div class="flat">'+logged.map(x=>{
      const rn = rhythmName(x.rhythmId), desc = x.note || rn || "One-off";
      // the tag only earns its place when it says something the text doesn't
      const tag = x.rhythmId ? (rn && rn!==desc ? rn : "") : "one-off";
      return '<div class="led"><span class="d">'+pretty(x.date)+'</span>'+
        '<span class="grow trunc">'+esc(desc)+(tag?'<span class="tag">'+esc(tag)+'</span>':"")+'</span>'+
        '<span class="tnum">'+money(x.amount)+'</span>'+
        '<button class="linkbtn" data-a="deltxn" data-id="'+x.id+'">\u00d7</button></div>';
    }).join("")+'</div></div>' : "";

  return '<div class="wk">'+
    switcher +
    '<div class="wk-top"><p class="eyebrow">'+periodRange(cad, ps)+'</p>'+head+actions+'</div>'+
    quick + lines + held + list +
    '<div class="sec" style="text-align:center"><button class="btn btn-ghost btn-sm" data-go="book:'+book.id+'">'+
      'Wallets, projects &amp; full ledger \u2192</button></div>'+
  '</div>';
}

/* The expected date, asked once and reused by both forms. A weekly rhythm
   ignores it; everything slower needs it, because the date is what decides
   which week the thing appears in at all. */
function dueFields(r){
  const mo = r.dueMonth || 1, day = r.dueDay || 1;
  return '<div class="grid g2" style="margin-top:14px">'+
    '<div><label class="label">Expected month</label>'+
      '<input class="field tnum" name="dueMonth" inputmode="numeric" value="'+mo+'">'+
      '<span class="tiny faint">Annual: 1–12. Quarterly: which month of the quarter, 1–3. Ignored weekly and monthly.</span></div>'+
    '<div><label class="label">Expected day</label>'+
      '<input class="field tnum" name="dueDay" inputmode="numeric" value="'+day+'">'+
      '<span class="tiny faint">Day of the month it falls due. It only shows up in that week.</span></div>'+
    '<div style="grid-column:1/-1"><label class="flat" style="padding:12px 14px;display:block;cursor:pointer">'+
      '<span class="row" style="gap:8px"><input type="checkbox" name="reserve" value="1"'+(r.reserve?" checked":"")+'>'+
      '<b class="small">Carry it monthly — a reserve</b></span>'+
      '<span class="tiny faint" style="display:block;margin-top:4px;padding-left:24px">'+
      'For a quarterly or annual obligation you cannot skip. It sets aside its share each month and is settled from that reserve on its date, '+
      'so the week it lands does not swallow the number. Short reserves are flagged at the board meeting.</span></label></div>'+
  '</div>';
}

/* ---- Rhythms, scoped to one book. They live on the book they charge, not in
   a single global list. Whether they held is the board meeting's business. ---- */
function rhythmsSection(bookId){
  const t = today();
  const all = rhythmsFor(bookId);
  const flagged = all.map(r=>({r, rev:rhythmReview(r)})).filter(x=>x.rev);
  const cads = CADENCES.filter(c=>rhythmsFor(bookId,c).length);

  const summary = cads.length ? '<div class="gstat">'+
    cads.map(cad=>{
      const rs = rhythmsFor(bookId,cad);
      const total = rs.reduce((s,r)=>s+r.amount,0);
      return '<div class="stat"><p class="label">'+CAD_LABEL[cad]+'</p>'+
        '<p class="n tnum">'+money(total)+'</p>'+
        '<p class="why">'+rs.length+' rhythm'+(rs.length===1?"":"s")+' per '+CAD_UNIT[cad]+'</p></div>';
    }).join("")+'</div>' : "";

  const review = flagged.length ? '<div class="card" style="padding:14px 18px;margin-top:12px;border-color:rgba(255,149,0,.35);background:rgba(255,149,0,.06)">'+
    '<p class="small"><b>'+flagged.length+' rhythm'+(flagged.length===1?" has":"s have")+' earned a review.</b> '+
    '<span class="sub">Consistent overspend is evidence the number was a bad guess. It is decided at the meeting, not here.</span> '+
    '<button class="linkbtn neutral" data-go="meeting" style="color:var(--act)">Take it to the board \u2192</button></p></div>' : "";

  const groups = cads.map(cad=>{
    const rs = rhythmsFor(bookId,cad);
    const total = rs.reduce((s,r)=>s+r.amount,0);
    return '<div class="cadhead"><h3>'+CAD_LABEL[cad]+'</h3>'+
      '<span class="t tnum">'+money(total)+' / '+CAD_UNIT[cad]+'</span></div>'+
      '<div class="grid" style="gap:10px">'+rs.map(r=>rhythmCard(r,t)).join("")+'</div>';
  }).join("");

  const addForm = det("r-new-"+bookId, "+ Set a new rhythm on this book",
    '<input type="hidden" name="bookId" value="'+bookId+'">'+
    '<div class="grid g2">'+
      '<div><label class="label">What is it?</label><input class="field" name="name" placeholder="Groceries, rent, payroll\u2026" required></div>'+
      '<div><label class="label">Amount per period</label><input class="field tnum" name="amount" inputmode="decimal" placeholder="0.00" required></div>'+
      '<div><label class="label">Rhythm</label><select class="field" name="cadence">'+
        CADENCES.map(c=>'<option value="'+c+'"'+(c==="weekly"?" selected":"")+'>'+CAD_LABEL[c]+'</option>').join("")+'</select></div>'+
    '</div>'+
    dueFields({}) +
    '<div style="margin-top:14px"><label class="label">Which kind?</label><div class="grid g2">'+
      '<label class="flat" style="padding:12px 14px;display:block;cursor:pointer"><span class="row" style="gap:8px"><input type="radio" name="type" value="flexible" checked><b class="small">A ceiling \u2014 stay under it</b></span>'+
        '<span class="tiny faint" style="display:block;margin-top:4px;padding-left:24px">Groceries, gas, dinner out. You keep it below the line.</span></label>'+
      '<label class="flat" style="padding:12px 14px;display:block;cursor:pointer"><span class="row" style="gap:8px"><input type="radio" name="type" value="fixed"><b class="small">An obligation \u2014 pay it</b></span>'+
        '<span class="tiny faint" style="display:block;margin-top:4px;padding-left:24px">Rent, tithe, payroll, subscriptions. It goes out on schedule.</span></label>'+
    '</div></div>'+
    '<button class="btn btn-primary" style="margin-top:16px">Set the rhythm</button>', "addrhythm", "card", "act");

  return '<div class="sec"><h2 class="sec-h">Rhythms</h2>'+
    '<p class="sec-r">The standing habits charged to this book \u2014 each with an amount and a cadence. This book\u2019s number is the sum of its rhythms at its finest cadence; you never declare it, you set these.</p>'+
    summary + review + groups +
    (all.length ? "" : '<div class="card empty" style="margin-top:12px">No rhythms on this book yet. Set the first one below.</div>') +
    '<div style="margin-top:20px">'+addForm+'</div></div>';
}

function rhythmCard(r, t){
  const ps = periodStart(r.cadence, t);
  const spent = rhythmSpent(r, ps);
  const fixed = r.type === "fixed";
  const paid = fixed && spent >= r.amount;
  const over = !fixed && spent > r.amount;
  const pct = r.amount>0 ? Math.min(100, Math.round(spent/r.amount*100)) : 0;
  const streak = rhythmStreak(r);
  const rev = rhythmReview(r);
  const res = isReserved(r) ? reserveState(r, t) : null;

  let state;
  if(fixed) state = paid
    ? '<span class="pill p-up">Paid this '+CAD_UNIT[r.cadence]+'</span>'
    : '<span class="pill p-warn">Due '+(r.cadence==="weekly" ? "this week" : pretty(iso(dueDateOn(r,t))))+'</span>';
  else state = over
    ? '<span class="pill p-down">Over by '+money(spent-r.amount)+'</span>'
    : '<span class="pill p-mute">'+money(r.amount-spent)+' left</span>';

  return '<div class="card rcard">'+
    '<div class="rtop"><div class="grow"><p class="rname">'+esc(r.name)+'</p>'+
      '<p class="rmeta">'+money(r.amount)+' per '+CAD_UNIT[r.cadence]+' · '+(fixed?"obligation":"ceiling")+
        (r.cadence==="weekly" ? "" : ' · '+dueLabel(r,t))+'</p>'+
      (res ? '<p class="tiny faint" style="margin-top:3px">Carried at '+money(res.contrib)+' a month · '+
        money(Math.max(0,res.held))+' set aside so far</p>' : "")+'</div>'+
      '<div class="rfig"><p class="n tnum"'+(over?' style="color:var(--down)"':"")+'>'+money(spent)+'</p>'+
      '<p class="tiny faint">this '+CAD_UNIT[r.cadence]+'</p></div></div>'+
    (fixed ? "" : '<div class="bar"><i style="width:'+(over?100:pct)+'%;background:'+(over?"var(--down)":pct>=85?"var(--warn)":"var(--up)")+'"></i></div>')+
    '<div class="row" style="flex-wrap:wrap;gap:10px">'+ state +
      (streak>0?'<span class="pill p-up">'+streak+' in a row</span>':"")+
      (rev?'<span class="pill p-warn">Earned a review</span>':"")+
      (res ? (res.short>0
        ? '<span class="pill p-down">'+money(res.short)+' short by '+pretty(iso(res.due))+'</span>'
        : '<span class="pill p-teal">Reserve covers it</span>') : "")+
      '<span style="margin-left:auto" class="row">'+ historyStrip(r,8) +'</span></div>'+
    '<div class="row" style="gap:10px">'+
      (fixed && !paid ? '<button class="btn btn-ghost btn-sm" data-a="payrhythm" data-id="'+r.id+'">Mark paid — '+money(r.amount)+'</button>' : "")+
      '<button class="linkbtn neutral" data-a="editrhythm" data-id="'+r.id+'">Adjust</button>'+
      '<button class="linkbtn" data-a="delrhythm" data-id="'+r.id+'">Retire</button></div>'+
    (openIds.has("edit-"+r.id) ? '<form data-a="updrhythm" style="border-top:1px solid var(--line);padding-top:11px">'+
      '<input type="hidden" name="id" value="'+r.id+'">'+
      '<div class="row" style="gap:8px;flex-wrap:wrap">'+
        '<input class="field tnum" name="amount" value="'+dec(r.amount)+'" style="width:110px" inputmode="decimal" aria-label="Amount">'+
        '<select class="field" name="cadence" style="width:130px" aria-label="Cadence">'+CADENCES.map(c=>'<option value="'+c+'"'+(r.cadence===c?" selected":"")+'>'+CAD_LABEL[c]+'</option>').join("")+'</select>'+
      '</div>'+ dueFields(r) +
      '<button class="btn btn-primary btn-sm" style="margin-top:12px">Save the new number</button></form>' : "")+
  '</div>';
}

/* ---- The action sheet: one amount, then where it belongs ---- */
function projectOptions(bookId){
  return db.projects.filter(p=>p.bookId===bookId && p.status==="active")
    .map(p=>'<option value="'+p.id+'">'+esc(p.name)+'</option>').join("");
}
function bucketField(venture){
  return '<div data-bucket'+(venture?"":' style="display:none"')+'><label class="label">Bucket</label>'+
    '<select class="field" name="bucket"'+(venture?"":" disabled")+'>'+
      '<option value="burn">Burn — fixed</option><option value="fuel">Fuel — growth ceiling</option>'+
      '<option value="one-time">One-time — from surplus</option></select></div>';
}
function sheetView(){
  if(!sheet) return "";
  const kind = sheet.kind;
  const books = db.books.filter(b=>b.stage!=="wound-down");
  if(!books.length) return "";
  const bid = books.some(b=>b.id===sheet.bookId) ? sheet.bookId : books[0].id;
  const bk = db.books.find(b=>b.id===bid), venture = bk.kind==="venture";

  const title = kind==="income" ? "Received" : kind==="transfer" ? "Move money" : "Spend";
  const role  = kind==="income" ? "Money arriving in a book — say which one, and which wallet it lands in."
              : kind==="transfer" ? "Between wallets inside one book. Wealth only ever receives."
              : "Charged to a rhythm where it belongs, or logged as a one-off.";
  const cta   = kind==="income" ? "Record it" : kind==="transfer" ? "Move it" : "Log the spend";

  const bookField = '<div><label class="label">Which book?</label><select class="field" name="bookId">'+
    books.map(b=>'<option value="'+b.id+'"'+(b.id===bid?" selected":"")+'>'+
      esc(b.name)+(b.kind==="venture"?" · venture":"")+'</option>').join("")+'</select></div>';

  let fields;
  if(kind==="income"){
    fields = bookField +
      '<div><label class="label">Source</label><input class="field" name="source" placeholder="Client, salary, the draw…"></div>'+
      '<div><label class="label">Into which wallet?</label><select class="field" name="wallet">'+
        '<option value="operating">Operating</option><option value="buffer">Buffer</option>'+
        '<option value="wealth">Wealth</option></select></div>';
  } else if(kind==="transfer"){
    fields = bookField +
      '<div><label class="label">From</label><select class="field" name="wallet">'+
        '<option value="operating">Operating</option><option value="buffer">Buffer</option></select></div>'+
      '<div><label class="label">To</label><select class="field" name="toWallet">'+
        '<option value="buffer">Buffer</option><option value="operating">Operating</option>'+
        '<option value="wealth">Wealth</option></select></div>'+
      '<div><label class="label">Note</label><input class="field" name="note" placeholder="Buffer fill, wealth step…"></div>';
  } else {
    fields = bookField +
      '<div><label class="label">Against which rhythm?</label><select class="field" name="rhythmId">'+
        '<option value="__none">One-off — outside the rhythms</option>'+ rhythmOptions(bid) +'</select></div>'+
      '<div><label class="label">Against a project</label><select class="field" name="projectId">'+
        '<option value="">— none —</option>'+ projectOptions(bid) +'</select></div>'+
      bucketField(venture) +
      '<div><label class="label">Note</label><input class="field" name="note" placeholder="What was it?"></div>';
  }

  return '<div class="scrim" data-a="closesheet"></div>'+
    '<div class="sheet" data-sheet role="dialog" aria-modal="true" aria-label="'+title+'">'+
      '<div class="sheet-head"><h2>'+title+'</h2>'+
        '<button class="sheet-x" data-a="closesheet" aria-label="Close">×</button></div>'+
      '<p class="role">'+role+'</p>'+
      '<form data-a="sheetentry"><input type="hidden" name="kind" value="'+kind+'">'+

/* ---- chart ---- */
const SERIES = [{k:"operating",n:"Operating",c:"#FF9500"},{k:"buffer",n:"Buffer",c:"#30B0C7"},{k:"wealth",n:"Wealth",c:"#5856D6"}];
function chartSvg(bookId, weeks, labels){
  const W=640,H=210,P={t:12,r:92,b:24,l:46};
  const series = SERIES.map(s=>({name:s.n,color:s.c,values:weeks.map(w=> balances(bookId, iso(addDays(w,6)))[s.k]/100)}));
  const all = series.flatMap(s=>s.values);
  const max = Math.max(1,...all), min = Math.min(0,...all);
  const iw=W-P.l-P.r, ih=H-P.t-P.b, n=Math.max(1,weeks.length-1);
  const xs = weeks.map((_,i)=> P.l + i/n*iw);
  const y = v => P.t + ih - (v-min)/(max-min)*ih;
  const fmt = v => Math.abs(v)>=1000 ? "$"+(v/1000).toFixed(v%1000===0?0:1)+"k" : "$"+Math.round(v).toLocaleString();
  let g="";
  [min,min+(max-min)/2,max].forEach(v=>{
    g += '<line x1="'+P.l+'" x2="'+(W-P.r)+'" y1="'+y(v)+'" y2="'+y(v)+'" stroke="#E9E8E3"/>'+
         '<text x="'+(P.l-8)+'" y="'+(y(v)+3)+'" text-anchor="end" font-size="10" fill="#AEAEB2">'+fmt(v)+'</text>';
  });
  [...new Set([0,Math.floor((weeks.length-1)/2),weeks.length-1])].forEach(i=>{
    g += '<text x="'+xs[i]+'" y="'+(H-5)+'" text-anchor="middle" font-size="10" fill="#AEAEB2">'+labels[i]+'</text>';
  });
  let lines="",dots="";
  series.forEach((s,si)=>{
    lines += '<path d="'+xs.map((x,i)=>(i?"L":"M")+x+","+y(s.values[i])).join(" ")+'" fill="none" stroke="'+s.color+'" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>'+
      '<text x="'+(W-P.r+10)+'" y="'+(y(s.values[weeks.length-1])+3+(si===1?4:si===2?-4:0))+'" font-size="11" font-weight="600" fill="#1D1D1F"><tspan fill="'+s.color+'">●</tspan> '+s.name+'</text>';
    dots += '<circle class="hv" data-si="'+si+'" r="4" fill="'+s.color+'" stroke="#fff" stroke-width="2" style="display:none"/>';
  });
  const data = JSON.stringify({xs:xs,ys:series.map(s=>s.values.map(y)),vals:series.map(s=>s.values),labels:labels,W:W,top:P.t,bot:H-P.b});
  const table = '<details><summary style="padding:8px 0;font-size:12px;color:var(--faint)">View as table</summary><div class="scroll"><table class="tbl"><thead><tr><th>Week</th>'+
    series.map(s=>'<th>'+s.name+'</th>').join("")+'</tr></thead><tbody>'+
    labels.map((l,i)=>'<tr><td class="sub">'+l+'</td>'+series.map(s=>'<td class="tnum">'+fmt(s.values[i])+'</td>').join("")+'</tr>').join("")+
    '</tbody></table></div></details>';
  return '<div class="chartbox" data-chart=\''+data.replace(/'/g,"&#39;")+'\'>'+
    '<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Weekly wallet balances this quarter">'+g+
    '<line class="cross" stroke="#AEAEB2" stroke-dasharray="3 3" style="display:none"/>'+lines+dots+'</svg>'+
    '<div class="tip"></div>'+table+'</div>';
}

/* ---- Board meeting ---- */
function meetingView(){
  const q = quarterInfo(), t = today();
  const weeks = [];
  let w = weekStart(fromIso(q.start));
  if(iso(w) < q.start) w = addDays(w,7);
  while(iso(w) <= iso(t) && iso(w) <= q.end){ weeks.push(new Date(w)); w = addDays(w,7); }
  const labels = weeks.map(d=>pretty(iso(d)));

  const flagged = rhythmsFor().map(r=>({r,rev:rhythmReview(r)})).filter(x=>x.rev);
  const holding = rhythmsFor().filter(r=>rhythmStreak(r)>=3);

  const inc = new Map();
  for(const x of db.transactions){
    if(x.kind!=="income" || x.date<q.start || x.date>q.end) continue;
    const k = x.source||"Unlabeled";
    inc.set(k,(inc.get(k)||0)+x.amount);
  }
  const ventures = db.books.filter(b=>b.kind==="venture" && b.stage!=="wound-down");
  const pending = db.amendments.filter(a=>a.status==="pending");
  const active = db.books.filter(b=>b.stage!=="wound-down");
  const aprojects = db.projects.filter(p=>p.status==="active");
  const meetings = db.meetings.slice().sort((a,b)=> a.date<b.date?1:-1);

  const brief = '<div class="gstat">'+
    '<div class="stat"><p class="label">Rhythms holding</p>'+
      '<p class="n tnum"><span style="color:'+(flagged.length?"var(--ink)":"var(--up-ink)")+'">'+holding.length+'</span><span class="sub"> / '+rhythmsFor().length+'</span></p>'+
      '<p class="why">three periods running or better</p></div>'+
    '<div class="stat"><p class="label">Income by source</p>'+
      (inc.size?[...inc.entries()].sort((a,b)=>b[1]-a[1]).slice(0,4).map(e=>'<div class="kv"><span>'+esc(e[0])+'</span><span class="tnum">'+money(e[1])+'</span></div>').join(""):'<p class="why">None recorded this quarter.</p>')+'</div>'+
    '<div class="stat"><p class="label">Runway</p>'+
      (ventures.length?ventures.map(b=>{
        const r=runway(b), col=r===Infinity?"var(--faint)":r<2?"var(--down)":r<3?"var(--warn)":"var(--up-ink)";
        return '<div class="kv"><span>'+esc(b.name)+'</span><span class="tnum" style="color:'+col+'">'+(r===Infinity?"—":r.toFixed(1)+" mo")+'</span></div>';
      }).join(""):'<p class="why">No ventures on the books.</p>')+'</div></div>';

  /* A reserve that will not cover its bill is the quietest way to be caught
     out — it fails months ahead, in silence, and only announces itself on the
     day. So the meeting asks about it before the day arrives. */
  const reserves = rhythmsFor().filter(isReserved).map(r=>({r, s:reserveState(r,t)}));
  const short = reserves.filter(x=>x.s.short>0);
  const reserveSec = reserves.length ? '<div class="sec"><h2 class="sec-h">Reserves</h2>'+
    '<p class="sec-r">What is carried a month at a time toward an obligation that lands once. A shortfall here is a decision owed now, not on the due date.</p>'+
    '<div class="card">'+ reserves.map(x=>
      '<div class="rowsplit"><div class="grow"><p class="small" style="font-weight:600">'+esc(x.r.name)+'</p>'+
        '<p class="tiny faint">'+bookName(x.r.bookId)+' · '+money(x.r.amount)+' due '+pretty(iso(x.s.due))+
          ' · carried at '+money(x.s.contrib)+' a month</p></div>'+
      '<div style="flex:0 0 auto;text-align:right"><p class="tnum small">'+money(Math.max(0,x.s.held))+' set aside</p>'+
        (x.s.short>0
          ? '<span class="pill p-down">'+money(x.s.short)+' short by then</span>'
          : '<span class="pill p-up">covered</span>')+'</div></div>').join("")+
    '</div>'+
    (short.length ? '<p class="tiny faint" style="margin-top:8px">Raise the monthly carry, move the date, or fund the gap from the buffer — but decide it here.</p>' : "")+
    '</div>' : "";

  const reviewSec = '<div class="sec"><h2 class="sec-h">Rhythms that earned a review</h2>'+
    '<p class="sec-r">A quarter of consistent overspend is evidence, not weakness. Amend the number or change the life — but decide it here.</p>'+
    '<div class="card">'+ (flagged.length ? flagged.map(x=>{
      const cur = rhythmSpent(x.r, periodStart(x.r.cadence,t));
      return '<div class="rowsplit"><div class="grow"><p class="small" style="font-weight:600">'+esc(x.r.name)+'</p>'+
        '<p class="tiny faint">'+bookName(x.r.bookId)+' · set at '+money(x.r.amount)+'/'+CAD_UNIT[x.r.cadence]+' · over in '+x.rev.missed+' of the last '+x.rev.of+'</p>'+
        '<div style="margin-top:7px">'+historyStrip(x.r,6)+'</div></div>'+
        '<form class="row" data-a="updrhythm" style="gap:8px;flex:0 0 auto"><input type="hidden" name="id" value="'+x.r.id+'">'+
        '<input class="field tnum" name="amount" value="'+dec(x.r.amount)+'" style="width:100px;padding:6px 10px" inputmode="decimal" aria-label="New amount for '+esc(x.r.name)+'">'+
        '<button class="btn btn-ghost btn-sm">Amend</button></form></div>';
    }).join("") : '<p class="empty">Every rhythm is holding. Nothing to reconsider this quarter.</p>')+'</div></div>';

  const charts = weeks.length ? active.map(b=>
    '<div class="card" style="padding:18px;margin-top:12px">'+
      '<div class="charthead"><h3>'+esc(b.name)+'</h3>'+
        '<p class="tiny faint">Operating flat · buffer holds · wealth only steps upward</p></div>'+
      chartSvg(b.id,weeks,labels)+'</div>').join("") : "";

  const ledgers = aprojects.length ? '<div class="sec"><h2 class="sec-h">Project ledgers</h2><div class="card">'+
    aprojects.map(p=>{
      const pb=projectBalance(p);
      return '<div class="rowsplit"><div class="grow"><p class="small" style="font-weight:500">'+esc(p.name)+'</p><p class="tiny faint">'+esc(bookName(p.bookId))+' · what did the money buy?</p></div>'+
        '<p class="tnum small sub">funded '+money(pb.funded)+' · spent <b style="color:var(--ink)">'+money(pb.spent)+'</b></p></div>';
    }).join("")+'</div></div>' : "";

  const amRows = pending.length ? pending.map(a=>
    '<div class="rowsplit"><div class="grow"><p class="small" style="font-weight:500">'+esc(a.title)+'</p><p class="tiny sub">'+a.date+' — '+esc(a.reason)+'</p></div>'+
    // the two decisions are a pair — they wrap together or not at all
    '<div class="row" style="gap:8px;flex:0 0 auto">'+
      '<button class="btn btn-up btn-sm" data-a="decide" data-id="'+a.id+'" data-v="ratified">Ratify</button>'+
      '<button class="btn btn-down btn-sm" data-a="decide" data-id="'+a.id+'" data-v="rejected">Reject</button></div></div>').join("")
    : '<p class="empty">Nothing pending. Drift, if any, happened in daylight.</p>';

  const venture = det("newventure","Found a new venture",
    '<p class="tiny faint" style="margin-bottom:14px;line-height:1.6">Seed capital comes from surplus or a deliberate wealth allocation — never from buffers, never from another venture’s operating money. The seed is a ceiling with a date. Every venture is born on probation.</p>'+
    '<div class="grid g2">'+
      '<div><label class="label">Name</label><input class="field" name="name" placeholder="The new book’s name" required></div>'+
      '<div><label class="label">Seed amount</label><input class="field tnum" name="seedAmount" inputmode="decimal" placeholder="0.00"></div>'+
      '<div><label class="label">Seed ceiling</label><input class="field tnum" name="seedCeiling" inputmode="decimal" placeholder="0.00"></div>'+
      '<div><label class="label">To prove itself by</label><input class="field" name="seedDeadline" placeholder="Board meeting Q1 2027"></div>'+
      '<div><label class="label">Expected monthly burn</label><input class="field tnum" name="monthlyBurn" inputmode="decimal" placeholder="0.00"></div>'+
      '<div><label class="label">Buffer target</label><input class="field tnum" name="bufferTarget" inputmode="decimal" placeholder="0.00"></div>'+
    '</div><button class="btn btn-primary" style="margin-top:16px">Open the book</button>', "addvent","card");

  const history = meetings.map(m=>
    '<div class="card" style="padding:16px 20px;margin-top:10px"><p class="small" style="font-weight:600">'+esc(m.label)+
    ' <span class="tiny faint" style="font-weight:400;margin-left:6px">'+m.date+'</span></p>'+
    '<ul style="margin:8px 0 0;padding-left:20px" class="small sub">'+m.resolutions.map(r=>'<li>'+esc(r)+'</li>').join("")+'</ul>'+
    (m.notes?'<p class="tiny faint" style="margin-top:8px">'+esc(m.notes)+'</p>':"")+'</div>').join("");

  return '<div class="phead"><div class="row" style="justify-content:space-between;flex-wrap:wrap;gap:8px">'+
      '<h1>The Board Meeting</h1><span class="pill p-mute">'+q.label+' · week '+Math.max(1,weeks.length)+' of 13</span></div>'+
      '<p class="role">The only place the system itself may be questioned. Thirteen weeks of evidence, read once, then written into resolutions. Doubt has an appointment, so it doesn’t wander the halls.</p></div>'+
    brief + reserveSec + reviewSec +
    '<div class="sec"><h2 class="sec-h">The quarter, in three lines per book</h2><p class="sec-r">Earned the right to be seen four times a year.</p>'+charts+'</div>'+
    ledgers +
    '<div class="sec"><h2 class="sec-h">Amendments awaiting ratification</h2><div class="card">'+amRows+'</div></div>'+
    '<div class="sec">'+venture+'</div>'+
    '<div class="sec"><h2 class="sec-h">Resolutions</h2><p class="sec-r">Written, dated, in force until next quarter.</p>'+
    '<form class="card" style="padding:20px" data-a="closemeeting"><input type="hidden" name="label" value="'+q.label+'">'+
      '<div><label class="label">Next quarter’s numbers, ratified changes, births &amp; wind-downs — one per line</label>'+
      '<textarea class="field" name="resolutions" rows="4" required placeholder="Dinner-out rhythm raised to $70&#10;Buffer target raised to $12,000"></textarea></div>'+
      '<div style="margin-top:12px"><label class="label">Notes (optional)</label><input class="field" name="notes"></div>'+
      '<button class="btn btn-primary" style="margin-top:14px">Close the meeting</button></form>'+history+'</div>';
}
