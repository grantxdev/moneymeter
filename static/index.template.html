<title>Moneymeter</title>
<style>
@font-face{font-family:"Instrument Sans";src:url(data:font/woff2;base64,__FONT_N__) format("woff2");font-weight:400 700;font-style:normal;font-display:swap}
@font-face{font-family:"Instrument Sans";src:url(data:font/woff2;base64,__FONT_I__) format("woff2");font-weight:400 700;font-style:italic;font-display:swap}

:root{
  --paper:#FAFAF7; --sunk:#F3F2ED; --card:#FFFFFF; --line:#E9E8E3; --line-soft:#F0EFEB;
  --ink:#1D1D1F; --sub:#6E6E73; --faint:#AEAEB2;
  --up:#34C759; --up-ink:#1E8E3E; --down:#FF3B30; --warn:#FF9500; --warn-ink:#B25E00;

  --shadow:0 1px 2px rgba(29,29,31,.04), 0 4px 16px rgba(29,29,31,.045);
  color-scheme:light;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; background:var(--paper); color:var(--ink);
  font-family:"Instrument Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  font-size:15px; line-height:1.5; -webkit-font-smoothing:antialiased;
}
.tnum{font-variant-numeric:tabular-nums}
h1,h2,h3{margin:0;text-wrap:balance;letter-spacing:-.02em}
p{margin:0}
button{font:inherit;color:inherit}
a{color:var(--act);text-decoration:none}
:focus-visible{outline:2px solid var(--act);outline-offset:2px;border-radius:8px}

/* ---------- shell ---------- */
.topbar{position:sticky;top:0;z-index:20;background:rgba(250,250,247,.92);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.topbar-in{max-width:920px;margin:0 auto;padding:12px 20px;display:flex;align-items:center;gap:3px;overflow-x:auto;scrollbar-width:none}
.topbar-in::-webkit-scrollbar{display:none}
.brand{font-weight:600;font-size:15px;letter-spacing:-.02em;margin-right:12px;flex-shrink:0}

.navlink:hover{background:var(--line-soft);color:var(--ink)}
.navlink[aria-current="page"]{background:var(--ink);color:#fff}
.navsep{width:1px;height:16px;background:var(--line);margin:0 7px;flex-shrink:0}
.signout{margin-left:auto;flex-shrink:0;border:0;background:none;padding:6px 12px;border-radius:999px;font-size:14px;color:var(--faint);cursor:pointer}

/* ---------- page headers ---------- */
.phead{margin-bottom:26px}

.card{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}
.flat{background:var(--card);border:1px solid var(--line);border-radius:16px}

.btn-primary{background:var(--ink);color:#fff}
.btn-primary:hover{background:#000}
.btn-ghost{background:var(--card);border-color:var(--line);color:var(--ink)}

.btn-sm{padding:5px 13px;font-size:13px}
.btn-up{background:rgba(52,199,89,.12);color:var(--up-ink)}
.btn-up:hover{background:rgba(52,199,89,.2)}
.btn-down{background:rgba(255,59,48,.1);color:var(--down)}
.btn-down:hover{background:rgba(255,59,48,.18)}
.linkbtn{border:0;background:none;padding:0;font-size:13px;color:var(--faint);cursor:pointer}

.field{width:100%;border:1px solid var(--line);background:var(--paper);border-radius:11px;padding:9px 12px;font-size:14px;font-family:inherit;color:var(--ink)}
.field::placeholder{color:var(--faint)}
.field:focus{outline:none;border-color:rgba(29,29,31,.28);background:var(--card)}
select.field{appearance:none;background-image:url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 12 12'%3E%3Cpath fill='%236E6E73' d='M3 5l3 3 3-3z'/%3E%3C/svg%3E");background-repeat:no-repeat;background-position:right 10px center;padding-right:28px}
textarea.field{resize:vertical;line-height:1.55}
.label{display:block;margin-bottom:5px;font-size:11px;font-weight:500;text-transform:uppercase;letter-spacing:.06em;color:var(--sub)}

.tiny{font-size:12px} .small{font-size:13px}

.grid{display:grid;gap:12px}
.g3{grid-template-columns:repeat(3,1fr)}

.row{display:flex;align-items:center;gap:12px}

.bar{height:6px;border-radius:999px;background:var(--line);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:999px;transition:width .4s ease}
details>summary{cursor:pointer;list-style:none;padding:14px 20px;font-size:14px;font-weight:500;user-select:none}
details>summary::-webkit-details-marker{display:none}
details>summary::before{content:"›";display:inline-block;margin-right:8px;color:var(--faint);transition:transform .2s}

.empty{padding:18px 20px;font-size:13px;color:var(--faint)}

/* ---------- login ---------- */
.login{min-height:88vh;display:flex;align-items:center;justify-content:center;padding:24px}
.login-in{width:100%;max-width:340px}
.login h1{font-size:26px;text-align:center}
.login .tag{text-align:center;color:var(--sub);font-size:14px;margin-top:4px}
.login form{padding:24px;margin-top:28px}
.login .btn{width:100%;margin-top:16px}

/* ---------- this week ---------- */
.week{max-width:520px;margin:0 auto}
.week-top{text-align:center}
.eyebrow{font-size:11px;font-weight:500;text-transform:uppercase;letter-spacing:.08em;color:var(--sub)}
.bignum{font-size:62px;font-weight:600;letter-spacing:-.045em;line-height:1.05;margin-top:14px}
/* the log bar sits *in* the paper, not on a white card */
.quick{background:var(--sunk);border:1px solid var(--line);border-radius:18px;padding:12px;margin-top:32px;display:flex;flex-direction:column;gap:10px}
.quick-top{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 14px}
.quick-top input{border:0;background:none;font:inherit;font-size:15px;padding:0;min-width:0;width:100%}
.quick-top input:focus{outline:none}
.quick-top input::placeholder{color:var(--faint)}
.quick-top .cur{color:var(--faint);font-size:15px}
.quick-row{display:flex;gap:8px}
.quick-row select{flex:1;min-width:0}
.rhythmline{display:flex;align-items:center;gap:10px;padding:10px 4px}
.rhythmline .nm{font-size:14px}
.rhythmline .bar{width:74px;flex-shrink:0}

/* ---------- rhythms ---------- */
.rcard{padding:16px 18px;display:flex;flex-direction:column;gap:11px}
.rtop{display:flex;align-items:flex-start;gap:10px}
.rname{font-size:15px;font-weight:600;letter-spacing:-.01em}
.rmeta{font-size:12px;color:var(--faint);margin-top:1px}
.rfig{margin-left:auto;text-align:right;flex-shrink:0}
.rfig .n{font-size:15px;font-weight:600}
.strip{display:flex;gap:3px;align-items:center}
.strip i{width:14px;height:6px;border-radius:2px;background:var(--line);display:block}
.strip i.ok{background:var(--up)}

.cadhead{display:flex;align-items:baseline;gap:10px;margin:28px 0 12px}
.cadhead h3{font-size:14px;font-weight:600;text-transform:uppercase;letter-spacing:.07em}
.cadhead .t{margin-left:auto;font-size:13px;color:var(--sub)}

/* ---------- segmented ---------- */
.seg{display:inline-flex;background:var(--sunk);border-radius:999px;padding:3px;gap:2px}
.seg button{border:0;background:none;padding:6px 15px;border-radius:999px;font-size:13px;font-weight:500;color:var(--sub);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--ink);box-shadow:0 1px 2px rgba(29,29,31,.08)}

/* ---------- ledger ---------- */
.led{display:flex;align-items:center;gap:12px;padding:10px 20px;border-top:1px solid var(--line);font-size:14px}
.led:first-child{border-top:0}
.led .d{width:52px;flex-shrink:0;font-size:12px;color:var(--faint)}
.tag{font-size:11px;color:var(--sub);background:var(--line-soft);border-radius:999px;padding:2px 8px;margin-left:6px;white-space:nowrap}

/* ---------- chart ---------- */
.chartbox{position:relative}
.chartbox svg{width:100%;display:block;touch-action:none}
.tip{position:absolute;top:6px;pointer-events:none;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:9px 12px;font-size:12px;box-shadow:var(--shadow);white-space:nowrap;display:none}
.tip h4{margin:0 0 5px;font-size:12px;font-weight:600}
.tip .r{display:flex;align-items:center;gap:8px;margin-top:3px}
.tip .dot{width:7px;height:7px;border-radius:999px;flex-shrink:0}
.tip .v{margin-left:auto;padding-left:16px;font-weight:500}
.tbl{width:100%;border-collapse:collapse;font-size:12px;margin-top:8px}
.tbl th{text-align:left;color:var(--sub);font-weight:500;padding:4px 12px 4px 0}
.tbl td{padding:4px 12px 4px 0;border-top:1px solid var(--line)}
.scroll{overflow-x:auto}

.foot{margin-top:56px;padding-top:20px;border-top:1px solid var(--line);display:flex;flex-wrap:wrap;gap:12px;align-items:center;font-size:12px;color:var(--faint)}

@media (max-width:760px){
  .wrap{padding:24px 16px 80px}
  .g3,.g2{grid-template-columns:1fr}
  .bignum{font-size:52px}
  .topbar-in{padding:10px 16px}
  .quick-row{flex-direction:column}

@media (prefers-reduced-motion:reduce){*{transition:none!important}}

<div id="app"></div>

<script>
"use strict";
const PASSWORD = "moneymeter";
const KEY = "moneymeter.db.v2";
const SESS = "moneymeter.authed";

/* ============ money & dates ============ */
const c2 = n => String(n).padStart(2,"0");
function money(cents){
  const s = cents < 0 ? "−" : "", a = Math.abs(cents), d = Math.floor(a/100), r = a%100;
  return s + "$" + d.toLocaleString("en-US") + (r ? "." + c2(r) : "");
}
function parseMoney(v){
  if(!v) return 0;
  const n = parseFloat(String(v).replace(/[$,\s]/g,""));
  return isFinite(n) ? Math.round(n*100) : 0;
}
function iso(d){ return d.getFullYear()+"-"+c2(d.getMonth()+1)+"-"+c2(d.getDate()); }
function fromIso(s){ const [y,m,d]=s.split("-").map(Number); return new Date(y,m-1,d); }
function pretty(s){ return fromIso(s).toLocaleDateString("en-US",{month:"short",day:"numeric"}); }
function weekStart(d){ const x=new Date(d); const k=(x.getDay()+6)%7; x.setDate(x.getDate()-k); x.setHours(0,0,0,0); return x; }
function addDays(d,n){ return new Date(d.getTime()+n*86400000); }
function today(){ const d=new Date(); d.setHours(0,0,0,0); return d; }
const uid = () => Math.random().toString(36).slice(2,10);

/* ============ cadence periods ============ */
const CADENCES = ["weekly","monthly","quarterly","annual"];
const CAD_LABEL = {weekly:"Weekly", monthly:"Monthly", quarterly:"Quarterly", annual:"Annual"};
const CAD_UNIT = {weekly:"week", monthly:"month", quarterly:"quarter", annual:"year"};

function periodStart(cad, d){
  const t = new Date(d);
  if(cad==="weekly") return weekStart(t);
  if(cad==="monthly") return new Date(t.getFullYear(), t.getMonth(), 1);
  if(cad==="quarterly") return new Date(t.getFullYear(), Math.floor(t.getMonth()/3)*3, 1);
  return new Date(t.getFullYear(), 0, 1);
}
function periodEnd(cad, s){
  if(cad==="weekly") return addDays(s,6);
  if(cad==="monthly") return new Date(s.getFullYear(), s.getMonth()+1, 0);
  if(cad==="quarterly") return new Date(s.getFullYear(), s.getMonth()+3, 0);
  return new Date(s.getFullYear(), 11, 31);
}
function prevPeriod(cad, s){
  if(cad==="weekly") return addDays(s,-7);
  if(cad==="monthly") return new Date(s.getFullYear(), s.getMonth()-1, 1);
  if(cad==="quarterly") return new Date(s.getFullYear(), s.getMonth()-3, 1);
  return new Date(s.getFullYear()-1, 0, 1);
}
function periodLabel(cad, s){
  if(cad==="weekly") return pretty(iso(s));
  if(cad==="monthly") return s.toLocaleDateString("en-US",{month:"short"});
  if(cad==="quarterly") return "Q" + (Math.floor(s.getMonth()/3)+1);
  return String(s.getFullYear());
}

/* ============ state ============ */
let db = null, route = "week", banner = "", authed = false, entryKind = "expense";
const openIds = new Set();

function save(){ try{ localStorage.setItem(KEY, JSON.stringify(db)); }catch(e){} }
function load(){ try{ const r = localStorage.getItem(KEY); if(r) return JSON.parse(r); }catch(e){} return null; }

/* ============ rhythms — the habit layer ============ */
function rhythmsFor(bookId, cad){
  return db.rhythms.filter(r => !r.archived && (!bookId || r.bookId===bookId) && (!cad || r.cadence===cad));
}
function rhythmSpent(r, startD){
  const s = iso(startD), e = iso(periodEnd(r.cadence, startD));
  let sum = 0;
  for(const t of db.transactions)
    if(t.rhythmId===r.id && t.kind==="expense" && t.date>=s && t.date<=e) sum += t.amount;
  return sum;
}
function met(r, spent){ return r.type==="fixed" ? spent >= r.amount : spent <= r.amount; }

/** Completed periods, newest first, bounded by when the rhythm was set. */
function completedPeriods(r, max){
  const out = [];
  let p = prevPeriod(r.cadence, periodStart(r.cadence, today()));
  for(let i=0;i<max;i++){
    if(iso(p) < r.start) break; // a period already underway when the rhythm was set isn't judged
    out.push(p);
    p = prevPeriod(r.cadence, p);
  }
  return out;
}
function rhythmStreak(r){
  let n = 0;
  for(const p of completedPeriods(r, 60)){
    if(!met(r, rhythmSpent(r,p))) break;
    n++;
  }
  return n;
}
/** "Consistently overspent" → this rhythm has earned a review at the board meeting. */
function rhythmReview(r){
  const ps = completedPeriods(r, 4);
  if(ps.length < 3) return null;
  const missed = ps.filter(p => !met(r, rhythmSpent(r,p))).length;
  return missed / ps.length >= 0.6 ? {missed, of: ps.length} : null;
}
function historyStrip(r, n){
  const ps = completedPeriods(r, n).reverse();
  let h = ps.map(p => '<i class="' + (met(r, rhythmSpent(r,p)) ? "ok" : "miss") + '" title="' + periodLabel(r.cadence,p) + ' · ' + money(rhythmSpent(r,p)) + '"></i>').join("");
  h += '<i class="now" title="this ' + CAD_UNIT[r.cadence] + ', still open"></i>';
  return '<span class="strip">' + h + '</span>';
}
/** The weekly number is not declared — it is the sum of the weekly rhythms. */
function weeklyNumber(bookId){
  return rhythmsFor(bookId, "weekly").reduce((s,r)=> s + r.amount, 0);
}
function weekSpend(bookId, d){
  const s = iso(weekStart(d)), e = iso(addDays(weekStart(d),6));
  const weeklyIds = new Set(rhythmsFor(bookId,"weekly").map(r=>r.id));
  let sum = 0;
  for(const t of db.transactions){
    if(t.bookId!==bookId || t.kind!=="expense" || t.wallet!=="operating") continue;
    if(t.date < s || t.date > e || t.projectId) continue;
    if(t.rhythmId && !weeklyIds.has(t.rhythmId)) continue; // slower rhythms aren't the week's business
    sum += t.amount;
  }
  return sum;
}

/* ============ money math ============ */
function balances(bookId, asOf){
  const b = {operating:0,buffer:0,wealth:0};
  for(const t of db.transactions){
    if(t.bookId!==bookId) continue;
    if(asOf && t.date > asOf) continue;
    if(t.kind==="income") b[t.wallet] += t.amount;
    else if(t.kind==="expense") b[t.wallet] -= t.amount;
    else if(t.kind==="transfer" && t.toWallet){ b[t.wallet]-=t.amount; b[t.toWallet]+=t.amount; }
  }
  return b;
}
function projectBalance(p){
  let funded=0, spent=0;
  for(const t of db.transactions){
    if(t.projectId!==p.id) continue;
    if(t.kind==="expense") spent+=t.amount; else funded+=t.amount;
  }
  return {funded, spent};
}
function bookIncome(bookId,s,e){
  let n=0;
  for(const t of db.transactions) if(t.bookId===bookId&&t.kind==="income"&&t.date>=s&&t.date<=e) n+=t.amount;
  return n;
}
function runway(book){
  if(!book.monthlyBurn || book.monthlyBurn<=0) return Infinity;
  return balances(book.id).buffer / book.monthlyBurn;
}
/** Monthly burn implied by the book's own fixed rhythms. */
function impliedBurn(bookId){
  let n = 0;
  for(const r of rhythmsFor(bookId)){
    if(r.type!=="fixed") continue;
    n += r.cadence==="weekly" ? r.amount*52/12 : r.cadence==="monthly" ? r.amount
       : r.cadence==="quarterly" ? r.amount/3 : r.amount/12;
  }
  return Math.round(n);
}
function quarterInfo(){
  const t=today(), y=t.getFullYear(), q=Math.floor(t.getMonth()/3)+1;
  return {y,q,label:"Q"+q+" "+y,start:iso(new Date(y,(q-1)*3,1)),end:iso(new Date(y,q*3,0))};
}

/* ============ helpers ============ */
const esc = s => String(s==null?"":s).replace(/[&<>"']/g, m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));
const dec = c => c ? (c/100).toString() : "";
const bookName = id => (db.books.find(b=>b.id===id)||{}).name || "";
const rhythmName = id => (db.rhythms.find(r=>r.id===id)||{}).name || "";
function det(id, summary, body, action, containerCls, summaryCls){
  return '<details class="'+(containerCls||"")+'" data-id="'+id+'"'+(openIds.has(id)?" open":"")+'>'+
    '<summary'+(summaryCls?' class="'+summaryCls+'"':"")+'>'+summary+'</summary>'+
    '<form class="dbody" data-a="'+action+'">'+body+'</form></details>';
}
function go(r){ route=r; banner=""; render(true); }
function fail(m){ banner=m; render(); }
function phead(title, role){
  return '<div class="phead"><h1>'+title+'</h1><p class="role">'+role+'</p></div>';
}
function rhythmOptions(bookId, cad, selected){
  const rs = rhythmsFor(bookId, cad);
  return rs.map(r=>'<option value="'+r.id+'"'+(selected===r.id?" selected":"")+'>'+esc(r.name)+' · '+money(r.amount)+'/'+CAD_UNIT[r.cadence]+'</option>').join("");
}

/* ============ views ============ */
function loginView(){
  return '<div class="login"><div class="login-in">'+
    '<h1>Moneymeter</h1><p class="tag">A constitution for money.</p>'+
    '<form class="card" data-a="login">'+
      '<label class="label" for="pw">Password</label>'+
      '<input class="field" id="pw" name="password" type="password" autofocus placeholder="Enter password" autocomplete="current-password">'+
      (banner?'<p class="small" style="color:var(--down);margin-top:8px">'+esc(banner)+'</p>':"")+
      '<button class="btn btn-primary">Enter</button></form>'+
    '<p class="tiny faint" style="text-align:center;margin-top:22px">Private preview — the password is <b>moneymeter</b>.</p>'+
  '</div></div>';
}

function navView(){
  const main = [{r:"week",l:"This Week"},{r:"rhythms",l:"Rhythms"}];
  const books = db.books.map(b=>({r:"book:"+b.id,l:b.name}));
  const slow = [{r:"constitution",l:"Constitution"},{r:"meeting",l:"Board Meeting"}];
  const btn = x => '<button class="navlink" data-go="'+x.r+'"'+(route===x.r?' aria-current="page"':"")+'>'+esc(x.l)+'</button>';
  return '<header class="topbar"><div class="topbar-in">'+
    '<span class="brand">Moneymeter</span>'+
    main.map(btn).join("") + '<span class="navsep"></span>' +
    books.map(btn).join("") + '<span class="navsep"></span>' +
    slow.map(btn).join("") +
    '<button class="signout" data-a="logout">Sign out</button></div></header>';
}

/* ---- This Week: log against a rhythm, nothing else ---- */
function weekView(){
  const book = db.books.find(b=>b.kind==="personal") || db.books[0];
  const t = today(), ws = weekStart(t);
  const num = weeklyNumber(book.id), spent = weekSpend(book.id, t);
  const left = num - spent, over = left < 0;
  const pct = num>0 ? Math.min(100, Math.round(spent/num*100)) : 0;
  const weeklies = rhythmsFor(book.id,"weekly");

  const list = db.transactions
    .filter(x=>x.bookId===book.id && x.kind==="expense" && x.wallet==="operating" && !x.projectId && x.date>=iso(ws))
    .sort((a,b)=> a.date<b.date?1:-1);

  let head;
  if(num > 0){
    const col = over ? "var(--down)" : pct>=85 ? "var(--warn)" : "var(--up)";
    head = '<p class="bignum tnum"'+(over?' style="color:var(--down)"':"")+'>'+money(Math.abs(left))+'</p>'+
      '<p class="small sub" style="margin-top:6px">'+(over
        ? '<span style="color:var(--down);font-weight:500">over the week’s rhythms</span>'
        : 'left of <b class="tnum" style="color:var(--ink)">'+money(num)+'</b>')+'</p>'+
      '<div class="bar" style="width:220px;margin:20px auto 0"><i style="width:'+(over?100:pct)+'%;background:'+col+'"></i></div>';
  } else {
    head = '<div class="flat" style="margin-top:24px;padding:20px;font-size:14px;color:var(--sub);text-align:left">'+
      'No weekly rhythms yet. The week’s number isn’t declared — it’s the sum of the rhythms you set. '+
      '<button class="linkbtn neutral" data-go="rhythms" style="color:var(--act)">Set your rhythms →</button></div>';
  }

  const quick = weeklies.length ? '<form class="quick" data-a="quicklog">'+
      '<div class="quick-top"><span class="cur">$</span>'+
      '<input class="tnum" name="amount" inputmode="decimal" placeholder="0.00" required autocomplete="off"></div>'+
      '<div class="quick-row">'+
        '<select class="field" name="rhythmId" required>'+
          '<option value="">Which rhythm?</option>'+ rhythmOptions(book.id,"weekly") +
          '<option value="__none">One-off — outside the rhythms</option>'+
        '</select>'+
        '<input class="field" name="note" placeholder="Note (optional)" style="flex:1">'+
        '<button class="btn btn-primary">Log it</button>'+
      '</div></form>' : "";

  const lines = weeklies.length ? '<div class="sec">'+
    '<p class="eyebrow" style="margin-bottom:6px">This week’s rhythms</p>'+
    weeklies.map(r=>{
      const s = rhythmSpent(r, ws), p = r.amount>0 ? Math.min(100, Math.round(s/r.amount*100)) : 0;
      const o = s > r.amount;
      return '<div class="rhythmline"><span class="nm grow trunc">'+esc(r.name)+'</span>'+
        '<span class="bar"><i style="width:'+(o?100:p)+'%;background:'+(o?"var(--down)":p>=85?"var(--warn)":"var(--up)")+'"></i></span>'+
        '<span class="tnum small'+(o?'" style="color:var(--down)':"")+'">'+money(s)+'<span class="faint"> / '+money(r.amount)+'</span></span></div>';
    }).join("")+'</div>' : "";

  const logged = list.length ? '<div class="sec"><p class="eyebrow" style="margin-bottom:6px">Logged this week</p>'+
    '<div class="flat">'+list.map(x=>
      '<div class="led"><span class="d">'+pretty(x.date)+'</span>'+
      '<span class="grow trunc">'+esc(x.note || rhythmName(x.rhythmId) || "One-off")+
        (x.rhythmId?'<span class="tag">'+esc(rhythmName(x.rhythmId))+'</span>':'<span class="tag">one-off</span>')+'</span>'+
      '<span class="tnum">'+money(x.amount)+'</span>'+
      '<button class="linkbtn" data-a="deltxn" data-id="'+x.id+'">×</button></div>').join("")+'</div></div>' : "";

  return '<div class="week"><div class="week-top">'+
    '<p class="eyebrow">The week of '+pretty(iso(ws))+' – '+pretty(iso(addDays(ws,6)))+'</p>'+head+'</div>'+
    quick + lines + logged +
    '<p class="tiny faint" style="margin-top:44px;text-align:center;line-height:1.6">Everything slower lives behind its own cadence — rhythms hold the habits, books hold the wallets, the board meeting holds the questions.</p>'+
  '</div>';
}

/* ---- Rhythms: the habit system ---- */
function rhythmsView(){
  const t = today();
  const all = rhythmsFor();
  const flagged = all.map(r=>({r, rev:rhythmReview(r)})).filter(x=>x.rev);

  const summary = '<div class="grid g3">'+
    ['weekly','monthly','quarterly'].map(cad=>{
      const rs = rhythmsFor(null,cad);
      const total = rs.reduce((s,r)=>s+r.amount,0);
      return '<div class="card" style="padding:16px 18px"><p class="label">'+CAD_LABEL[cad]+'</p>'+
        '<p class="tnum" style="font-size:22px;font-weight:600">'+money(total)+'</p>'+
        '<p class="tiny faint" style="margin-top:3px">'+rs.length+' rhythm'+(rs.length===1?"":"s")+' per '+CAD_UNIT[cad]+'</p></div>';
    }).join("")+'</div>';

  const review = flagged.length ? '<div class="sec"><h2 class="sec-h">Earned a review</h2>'+
    '<p class="sec-r">Overspent in most of the last few periods. That is not a failure of will — it is a sign the number was a bad guess. Take it to the board meeting.</p>'+
    '<div class="card">'+flagged.map(x=>
      '<div class="rowsplit"><div class="grow"><p class="small" style="font-weight:600">'+esc(x.r.name)+'</p>'+
      '<p class="tiny faint">'+bookName(x.r.bookId)+' · over in '+x.rev.missed+' of the last '+x.rev.of+' '+CAD_UNIT[x.r.cadence]+'s</p></div>'+
      '<span class="pill p-warn">Review</span></div>').join("")+'</div></div>' : "";

  const groups = CADENCES.map(cad=>{
    const rs = rhythmsFor(null,cad);
    if(!rs.length) return "";
    const total = rs.reduce((s,r)=>s+r.amount,0);
    return '<div class="cadhead"><h3>'+CAD_LABEL[cad]+'</h3>'+
      '<span class="t tnum">'+money(total)+' / '+CAD_UNIT[cad]+'</span></div>'+
      '<div class="grid" style="gap:10px">'+rs.map(r=>rhythmCard(r,t)).join("")+'</div>';
  }).join("");

  const addForm = det("r-new", "+ Set a new rhythm",
    '<div class="grid g2">'+
      '<div><label class="label">What is it?</label><input class="field" name="name" placeholder="Groceries, rent, payroll…" required></div>'+
      '<div><label class="label">Which book?</label><select class="field" name="bookId">'+
        db.books.map(b=>'<option value="'+b.id+'">'+esc(b.name)+'</option>').join("")+'</select></div>'+
      '<div><label class="label">Amount per period</label><input class="field tnum" name="amount" inputmode="decimal" placeholder="0.00" required></div>'+
      '<div><label class="label">Rhythm</label><select class="field" name="cadence">'+
        CADENCES.map(c=>'<option value="'+c+'"'+(c==="weekly"?" selected":"")+'>'+CAD_LABEL[c]+'</option>').join("")+'</select></div>'+
    '</div>'+
    '<div style="margin-top:14px"><label class="label">Which kind?</label><div class="grid g2">'+
      '<label class="flat" style="padding:12px 14px;display:block;cursor:pointer"><span class="row" style="gap:8px"><input type="radio" name="type" value="flexible" checked><b class="small">A ceiling — stay under it</b></span>'+
        '<span class="tiny faint" style="display:block;margin-top:4px;padding-left:24px">Groceries, gas, dinner out. You keep it below the line.</span></label>'+
      '<label class="flat" style="padding:12px 14px;display:block;cursor:pointer"><span class="row" style="gap:8px"><input type="radio" name="type" value="fixed"><b class="small">An obligation — pay it</b></span>'+
        '<span class="tiny faint" style="display:block;margin-top:4px;padding-left:24px">Rent, tithe, payroll, subscriptions. It goes out on schedule.</span></label>'+
    '</div></div>'+
    '<button class="btn btn-primary" style="margin-top:16px">Set the rhythm</button>', "addrhythm", "card", "act");

  return phead("Rhythms", "The bold guess that life runs on a beat: a set list of systems, each with its own amount and cadence. You live inside them and log against them. When one is consistently overspent, it has earned a review — the number was wrong, not you.") +
    summary + review + groups +
    (all.length ? "" : '<div class="card empty" style="margin-top:20px">No rhythms yet. Set the first one below — start with the weekly ones, since those become your weekly number.</div>') +
    '<div class="sec">'+addForm+'</div>';
}

function rhythmCard(r, t){
  const ps = periodStart(r.cadence, t);
  const spent = rhythmSpent(r, ps);
  const fixed = r.type === "fixed";
  const paid = fixed && spent >= r.amount;
  const over = !fixed && spent > r.amount;
  const pct = r.amount>0 ? Math.min(100, Math.round(spent/r.amount*100)) : 0;
  const streak = rhythmStreak(r);
  const rev = rhythmReview(r);

  let state;
  if(fixed) state = paid
    ? '<span class="pill p-up">Paid this '+CAD_UNIT[r.cadence]+'</span>'
    : '<span class="pill p-warn">Due this '+CAD_UNIT[r.cadence]+'</span>';
  else state = over
    ? '<span class="pill p-down">Over by '+money(spent-r.amount)+'</span>'
    : '<span class="pill p-mute">'+money(r.amount-spent)+' left</span>';

  return '<div class="card rcard">'+
    '<div class="rtop"><div class="grow"><p class="rname">'+esc(r.name)+'</p>'+
      '<p class="rmeta">'+bookName(r.bookId)+' · '+money(r.amount)+' per '+CAD_UNIT[r.cadence]+' · '+(fixed?"obligation":"ceiling")+'</p></div>'+
      '<div class="rfig"><p class="n tnum"'+(over?' style="color:var(--down)"':"")+'>'+money(spent)+'</p>'+
      '<p class="tiny faint">this '+CAD_UNIT[r.cadence]+'</p></div></div>'+
    (fixed ? "" : '<div class="bar"><i style="width:'+(over?100:pct)+'%;background:'+(over?"var(--down)":pct>=85?"var(--warn)":"var(--up)")+'"></i></div>')+
    '<div class="row" style="flex-wrap:wrap;gap:10px">'+ state +
      (streak>0?'<span class="pill p-up">'+streak+' in a row</span>':"")+
      (rev?'<span class="pill p-warn">Earned a review</span>':"")+
      '<span style="margin-left:auto" class="row">'+ historyStrip(r,8) +'</span></div>'+
    '<div class="row" style="gap:10px">'+
      (fixed && !paid ? '<button class="btn btn-ghost btn-sm" data-a="payrhythm" data-id="'+r.id+'">Mark paid — '+money(r.amount)+'</button>' : "")+
      '<button class="linkbtn neutral" data-a="editrhythm" data-id="'+r.id+'">Adjust</button>'+
      '<button class="linkbtn" data-a="delrhythm" data-id="'+r.id+'">Retire</button></div>'+
    (openIds.has("edit-"+r.id) ? '<form class="row" data-a="updrhythm" style="gap:8px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:11px">'+
      '<input type="hidden" name="id" value="'+r.id+'">'+
      '<input class="field tnum" name="amount" value="'+dec(r.amount)+'" style="width:110px" inputmode="decimal">'+
      '<select class="field" name="cadence" style="width:130px">'+CADENCES.map(c=>'<option value="'+c+'"'+(r.cadence===c?" selected":"")+'>'+CAD_LABEL[c]+'</option>').join("")+'</select>'+
      '<button class="btn btn-primary btn-sm">Save the new number</button></form>' : "")+
  '</div>';
}

/* ---- Book: wallets, one entry form, projects, ledger ---- */
function bookView(id){
  const book = db.books.find(b=>b.id===id);
  if(!book) return '<p class="sub">That book is gone.</p>';
  const bal = balances(book.id), venture = book.kind==="venture";
  const bp = book.bufferTarget>0 ? Math.min(100, Math.round(bal.buffer/book.bufferTarget*100)) : 0;
  const projects = db.projects.filter(p=>p.bookId===book.id && p.status==="active");
  const ended = db.projects.filter(p=>p.bookId===book.id && p.status==="ended");
  const ledger = db.transactions.filter(t=>t.bookId===book.id).sort((a,b)=> a.date<b.date?1:-1).slice(0,16);
  const bookRhythms = rhythmsFor(book.id);

  const stageLabel = {seeded:"Seeded",probation:"On probation","self-funding":"Self-funding",contributing:"Contributing","wound-down":"Wound down"};
  const stageCls = {seeded:"p-warn",probation:"p-warn","self-funding":"p-teal",contributing:"p-up","wound-down":"p-mute"};
  let pills = "";
  if(venture && book.stage) pills += '<span class="pill '+stageCls[book.stage]+'">'+stageLabel[book.stage]+'</span>';
  if(venture && book.stage!=="wound-down"){
    const r = runway(book);
    const cls = r===Infinity?"p-mute":r<2?"p-down":r<3?"p-warn":"p-up";
    pills += ' <span class="pill tnum '+cls+'">'+(r===Infinity?"No burn set":r.toFixed(1)+" mo runway")+'</span>';
  }

  const wallets = '<div class="grid g3">'+
    '<div class="card" style="padding:18px"><p class="label">Operating</p><p class="tnum" style="font-size:24px;font-weight:600">'+money(bal.operating)+'</p><p class="tiny faint" style="margin-top:4px">Where the '+(venture?"business":"week")+' happens. Empties by design.</p></div>'+
    '<div class="card" style="padding:18px"><p class="label">Buffer</p><p class="tnum" style="font-size:24px;font-weight:600">'+money(bal.buffer)+'</p>'+
      (book.bufferTarget>0
        ? '<div class="bar" style="margin-top:10px"><i style="width:'+bp+'%;background:'+(bp>=100?"var(--up)":"var(--teal)")+'"></i></div><p class="tiny faint" style="margin-top:5px">'+bp+'% of '+money(book.bufferTarget)+' target</p>'
        : '<p class="tiny faint" style="margin-top:4px">No target set yet.</p>')+'</div>'+
    '<div class="card" style="padding:18px"><p class="label">Wealth</p><p class="tnum" style="font-size:24px;font-weight:600">'+money(bal.wealth)+'</p><p class="tiny faint" style="margin-top:4px">One-way valve. Only ever steps upward.</p></div>'+
  '</div>';

  // ONE entry form with a segmented type switch
  const seg = '<div class="seg">'+["expense","income","transfer"].map(k=>
    '<button type="button" data-a="entrykind" data-v="'+k+'" aria-pressed="'+(entryKind===k)+'">'+
    (k==="expense"?"Spend":k==="income"?"Receive":"Move")+'</button>').join("")+'</div>';

  let entryFields;
  if(entryKind==="income"){
    entryFields = '<div><label class="label">Source</label><input class="field" name="source" placeholder="'+(venture?"Client, product…":"The draw, salary…")+'"></div>'+
      '<div><label class="label">Into wallet</label><select class="field" name="wallet"><option value="operating">Operating</option><option value="buffer">Buffer</option><option value="wealth">Wealth</option></select></div>';
  } else if(entryKind==="transfer"){
    entryFields = '<div><label class="label">From</label><select class="field" name="wallet"><option value="operating">Operating</option><option value="buffer">Buffer</option></select></div>'+
      '<div><label class="label">To</label><select class="field" name="toWallet"><option value="buffer">Buffer</option><option value="operating">Operating</option><option value="wealth">Wealth</option></select></div>';
  } else {
    entryFields = '<div><label class="label">Against which rhythm?</label><select class="field" name="rhythmId">'+
        '<option value="__none">One-off — outside the rhythms</option>'+ rhythmOptions(book.id) +'</select></div>'+
      '<div><label class="label">Note</label><input class="field" name="note" placeholder="What was it?"></div>'+
      (projects.length?'<div><label class="label">Against a project</label><select class="field" name="projectId"><option value="">— none —</option>'+
        projects.map(p=>'<option value="'+p.id+'">'+esc(p.name)+'</option>').join("")+'</select></div>':"")+
      (venture?'<div><label class="label">Bucket</label><select class="field" name="bucket"><option value="burn">Burn — fixed</option><option value="fuel">Fuel — growth ceiling</option><option value="one-time">One-time — from surplus</option></select></div>':"");
  }

  const entry = '<div class="card" style="padding:18px">'+
    '<div class="row" style="margin-bottom:14px">'+seg+'</div>'+
    '<form data-a="entry"><input type="hidden" name="bookId" value="'+book.id+'"><input type="hidden" name="kind" value="'+entryKind+'">'+
      (entryKind==="expense"?'<input type="hidden" name="wallet" value="operating">':"")+
      '<div class="grid g2">'+
        '<div><label class="label">Amount</label><input class="field tnum" name="amount" inputmode="decimal" placeholder="0.00" required></div>'+
        entryFields +
      '</div>'+
      (entryKind==="transfer"?'<p class="tiny faint" style="margin-top:10px">Wealth only receives. The valve doesn’t open backward.</p>':"")+
      '<button class="btn btn-primary" style="margin-top:14px">'+(entryKind==="income"?"Record income":entryKind==="transfer"?"Move it":"Log the spend")+'</button>'+
    '</form></div>';

  const rhythmSummary = bookRhythms.length
    ? '<div class="card" style="padding:16px 18px"><div class="row"><div class="grow">'+
      '<p class="label" style="margin-bottom:2px">Rhythms on this book</p>'+
      '<p class="small sub">'+bookRhythms.length+' set · '+money(impliedBurn(book.id))+' of fixed obligation per month</p></div>'+
      '<button class="btn btn-ghost btn-sm" data-go="rhythms">Open rhythms</button></div></div>'
    : '<div class="card empty">No rhythms on this book yet. <button class="linkbtn neutral" data-go="rhythms" style="color:var(--act)">Set them →</button></div>';

  const projRows = projects.map(p=>{
    const pb = projectBalance(p);
    let rule="", cap=0, prog="";
    if(p.rule.type==="save"){
      rule = "Save-toward · target "+money(p.rule.target); cap = pb.funded-pb.spent;
      if(p.rule.target>0) prog = '<div class="bar" style="margin-top:12px"><i style="width:'+Math.min(100,Math.round(pb.funded/p.rule.target*100))+'%;background:var(--act)"></i></div>';
    } else if(p.rule.type==="ceiling"){
      rule = "Ceiling "+money(p.rule.cap)+" for "+p.rule.months+" months"; cap = p.rule.cap-pb.spent;
    } else rule = "At most "+p.rule.fraction+"% of income since start";
    return '<div class="card" style="padding:16px 18px;margin-bottom:10px"><div class="row" style="flex-wrap:wrap">'+
      '<div class="grow"><p class="small" style="font-weight:600">'+esc(p.name)+'</p>'+
      '<p class="tiny faint">'+rule+(p.endNote?" · ends: "+esc(p.endNote):"")+'</p></div>'+
      '<p class="tnum small"><span class="sub">spent </span>'+money(pb.spent)+
        (p.rule.type!=="fraction"?'<span class="sub"> · left </span><span style="color:'+(cap<=0?"var(--down)":"var(--up)")+'">'+money(Math.max(0,cap))+'</span>':"")+'</p>'+
      (p.rule.type==="save"?'<form class="row" data-a="fundproj" style="gap:8px"><input type="hidden" name="projectId" value="'+p.id+'">'+
        '<input class="field tnum" name="amount" inputmode="decimal" placeholder="0.00" style="width:96px;padding:6px 10px"><button class="btn btn-ghost btn-sm">Fund</button></form>':"")+
      '<button class="linkbtn neutral" data-a="endproj" data-id="'+p.id+'">End</button></div>'+prog+'</div>';
  }).join("");

  const projAdd = det("pr-"+book.id, "+ New project — four questions",
    '<input type="hidden" name="bookId" value="'+book.id+'">'+
    '<div class="grid g2"><div><label class="label">1 · What’s it for?</label><input class="field" name="name" placeholder="Furnishing, marketing push…" required></div>'+
    '<div><label class="label">2 · Which book?</label><input class="field" value="'+esc(book.name)+'" disabled></div></div>'+
    '<div style="margin-top:14px"><label class="label">3 · Funding rule</label><div class="grid g3">'+
      '<label class="flat" style="padding:12px"><span class="row" style="gap:8px"><input type="radio" name="ruleType" value="save" checked><b class="small">Save-toward</b></span><input class="field tnum" name="target" inputmode="decimal" placeholder="Target $" style="margin-top:8px"></label>'+
      '<label class="flat" style="padding:12px"><span class="row" style="gap:8px"><input type="radio" name="ruleType" value="ceiling"><b class="small">Ceiling for N months</b></span><input class="field tnum" name="cap" inputmode="decimal" placeholder="Cap $" style="margin-top:8px"><input class="field" name="months" type="number" min="1" placeholder="Months" style="margin-top:8px"></label>'+
      '<label class="flat" style="padding:12px"><span class="row" style="gap:8px"><input type="radio" name="ruleType" value="fraction"><b class="small">Fraction of income</b></span><input class="field" name="fraction" type="number" step="0.5" min="0" max="100" placeholder="%" style="margin-top:8px"></label>'+
    '</div></div>'+
    '<div style="margin-top:14px"><label class="label">4 · When / how does it end?</label><input class="field" name="endNote" placeholder="When funded · at board meeting N · when shipped"></div>'+
    '<button class="btn btn-primary" style="margin-top:14px">Create project</button>', "addproj", "card", "act");

  const ledRows = ledger.length ? ledger.map(t=>{
    const sign = t.kind==="income"?"+":t.kind==="expense"?"−":"";
    const col = t.kind==="income"?"color:var(--up-ink)":t.kind==="transfer"?"color:var(--sub)":"";
    const desc = t.kind==="transfer"
      ? esc(t.note||"Transfer")+' · '+t.wallet+' → '+t.toWallet
      : esc(t.note || t.source || rhythmName(t.rhythmId) || (t.kind==="income"?"Income":"Expense"));
    return '<div class="led"><span class="d">'+pretty(t.date)+'</span>'+
      '<span class="grow trunc">'+desc+(t.rhythmId?'<span class="tag">'+esc(rhythmName(t.rhythmId))+'</span>':"")+
        (t.bucket?'<span class="tag">'+t.bucket+'</span>':"")+'</span>'+
      '<span class="tnum" style="'+col+'">'+sign+money(t.amount)+'</span>'+
      '<button class="linkbtn" data-a="deltxn" data-id="'+t.id+'">×</button></div>';
  }).join("") : '<p class="empty">No entries yet.</p>';

  const settings = det("bs-"+book.id, "Book settings",
    '<input type="hidden" name="bookId" value="'+book.id+'">'+
    '<div class="row" style="flex-wrap:wrap;align-items:flex-end;gap:10px">'+
      '<div style="width:170px"><label class="label">Name</label><input class="field" name="name" value="'+esc(book.name)+'"></div>'+
      '<div style="width:140px"><label class="label">Buffer target</label><input class="field tnum" name="bufferTarget" inputmode="decimal" value="'+dec(book.bufferTarget)+'" placeholder="0.00"></div>'+
      (venture
        ? '<div style="width:140px"><label class="label">Monthly burn</label><input class="field tnum" name="monthlyBurn" inputmode="decimal" value="'+dec(book.monthlyBurn)+'" placeholder="0.00"></div>'+
          '<div style="width:160px"><label class="label">Stage</label><select class="field" name="stage">'+
            ["seeded","probation","self-funding","contributing","wound-down"].map(s=>'<option value="'+s+'"'+(book.stage===s?" selected":"")+'>'+stageLabel[s]+'</option>').join("")+'</select></div>'
        : "")+
      '<button class="btn btn-primary">Save</button></div>', "updatebook", "card");

  return '<div class="phead"><div class="row" style="flex-wrap:wrap;gap:10px"><h1>'+esc(book.name)+'</h1>'+pills+'</div>'+

/* ---- chart ---- */
const SERIES = [{k:"operating",n:"Operating",c:"#FF9500"},{k:"buffer",n:"Buffer",c:"#30B0C7"},{k:"wealth",n:"Wealth",c:"#5856D6"}];
function chartSvg(bookId, weeks, labels){
  const W=640,H=210,P={t:12,r:92,b:24,l:46};
  const series = SERIES.map(s=>({name:s.n,color:s.c,values:weeks.map(w=> balances(bookId, iso(addDays(w,6)))[s.k]/100)}));
  const all = series.flatMap(s=>s.values);
  const max = Math.max(1,...all), min = Math.min(0,...all);
  const iw=W-P.l-P.r, ih=H-P.t-P.b, n=Math.max(1,weeks.length-1);
  const xs = weeks.map((_,i)=> P.l + i/n*iw);
  const y = v => P.t + ih - (v-min)/(max-min)*ih;
  const fmt = v => Math.abs(v)>=1000 ? "$"+(v/1000).toFixed(v%1000===0?0:1)+"k" : "$"+Math.round(v).toLocaleString();
  let g="";
  [min,min+(max-min)/2,max].forEach(v=>{
    g += '<line x1="'+P.l+'" x2="'+(W-P.r)+'" y1="'+y(v)+'" y2="'+y(v)+'" stroke="#E9E8E3"/>'+
         '<text x="'+(P.l-8)+'" y="'+(y(v)+3)+'" text-anchor="end" font-size="10" fill="#AEAEB2">'+fmt(v)+'</text>';
  });
  [...new Set([0,Math.floor((weeks.length-1)/2),weeks.length-1])].forEach(i=>{
    g += '<text x="'+xs[i]+'" y="'+(H-5)+'" text-anchor="middle" font-size="10" fill="#AEAEB2">'+labels[i]+'</text>';
  });
  let lines="",dots="";
  series.forEach((s,si)=>{
    lines += '<path d="'+xs.map((x,i)=>(i?"L":"M")+x+","+y(s.values[i])).join(" ")+'" fill="none" stroke="'+s.color+'" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>'+
      '<text x="'+(W-P.r+10)+'" y="'+(y(s.values[weeks.length-1])+3+(si===1?4:si===2?-4:0))+'" font-size="11" font-weight="600" fill="#1D1D1F"><tspan fill="'+s.color+'">●</tspan> '+s.name+'</text>';
    dots += '<circle class="hv" data-si="'+si+'" r="4" fill="'+s.color+'" stroke="#fff" stroke-width="2" style="display:none"/>';
  });
  const data = JSON.stringify({xs:xs,ys:series.map(s=>s.values.map(y)),vals:series.map(s=>s.values),labels:labels,W:W,top:P.t,bot:H-P.b});
  const table = '<details><summary style="padding:8px 0;font-size:12px;color:var(--faint)">View as table</summary><div class="scroll"><table class="tbl"><thead><tr><th>Week</th>'+
    series.map(s=>'<th>'+s.name+'</th>').join("")+'</tr></thead><tbody>'+
    labels.map((l,i)=>'<tr><td class="sub">'+l+'</td>'+series.map(s=>'<td class="tnum">'+fmt(s.values[i])+'</td>').join("")+'</tr>').join("")+
    '</tbody></table></div></details>';
  return '<div class="chartbox" data-chart=\''+data.replace(/'/g,"&#39;")+'\'>'+
    '<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Weekly wallet balances this quarter">'+g+
    '<line class="cross" stroke="#AEAEB2" stroke-dasharray="3 3" style="display:none"/>'+lines+dots+'</svg>'+
    '<div class="tip"></div>'+table+'</div>';
}

function wireCharts(){
  document.querySelectorAll(".chartbox").forEach(box=>{
    const d = JSON.parse(box.getAttribute("data-chart"));
    const svg = box.querySelector("svg"), tip = box.querySelector(".tip");
    const cross = box.querySelector(".cross"), dots = box.querySelectorAll(".hv");
    const fmt = v => Math.abs(v)>=1000 ? "$"+(v/1000).toFixed(v%1000===0?0:1)+"k" : "$"+Math.round(v).toLocaleString();
    function at(cx){
      const r = svg.getBoundingClientRect(), px = (cx-r.left)/r.width*d.W;
      let best=0,bd=Infinity;
      d.xs.forEach((x,i)=>{ const dd=Math.abs(x-px); if(dd<bd){bd=dd;best=i;} });
      cross.setAttribute("x1",d.xs[best]); cross.setAttribute("x2",d.xs[best]);
      cross.setAttribute("y1",d.top); cross.setAttribute("y2",d.bot); cross.style.display="";
      dots.forEach((c,si)=>{ c.setAttribute("cx",d.xs[best]); c.setAttribute("cy",d.ys[si][best]); c.style.display=""; });
      tip.innerHTML = "<h4>"+d.labels[best]+"</h4>"+SERIES.map((s,si)=>
        '<div class="r"><span class="dot" style="background:'+s.c+'"></span><span class="sub">'+s.n+'</span><span class="v tnum">'+fmt(d.vals[si][best])+'</span></div>').join("");
      tip.style.display="block";
      tip.style.left = (d.xs[best]/d.W*100)+"%";
      tip.style.transform = d.xs[best] > d.W/2 ? "translateX(calc(-100% - 12px))" : "translateX(12px)";
    }
    svg.addEventListener("mousemove", e=>at(e.clientX));
    svg.addEventListener("touchstart", e=>at(e.touches[0].clientX), {passive:true});
    svg.addEventListener("touchmove", e=>at(e.touches[0].clientX), {passive:true});
    const off = ()=>{ tip.style.display="none"; cross.style.display="none"; dots.forEach(c=>c.style.display="none"); };
    svg.addEventListener("mouseleave", off);
    svg.addEventListener("touchend", off);
  });
}

/* ============ actions ============ */
function addTxn(f){
  const kind = f.kind, amount = parseMoney(f.amount);
  if(!amount || amount<=0) return;
  const wallet = f.wallet || "operating";
  if(kind==="transfer"){
    if(wallet==="wealth") return fail("Wealth is a one-way valve — money does not come back out.");
    if(!f.toWallet || f.toWallet===wallet) return fail("Pick two different wallets.");
    if(amount > balances(f.bookId)[wallet]) return fail("Not enough in "+wallet+" for that transfer.");
  }
  if(kind==="expense" && f.projectId){
    const p = db.projects.find(x=>x.id===f.projectId);
    if(p){
      const pb = projectBalance(p);
      if(p.rule.type==="save" && pb.spent+amount > pb.funded)
        return fail(p.name+" is save-toward: it can only spend what it has accumulated ("+money(pb.funded-pb.spent)+" available).");
      if(p.rule.type==="ceiling" && pb.spent+amount > p.rule.cap)
        return fail(p.name+" would break its ceiling.");
      if(p.rule.type==="fraction"){
        const allowed = Math.floor(p.rule.fraction/100 * bookIncome(p.bookId,p.start,iso(today())));
        if(pb.spent+amount > allowed) return fail(p.name+" may consume at most "+p.rule.fraction+"% of income since it began — that ration is spent.");
      }
    }
  }
  const rid = f.rhythmId && f.rhythmId !== "__none" ? f.rhythmId : undefined;
  db.transactions.push({
    id:uid(), bookId:f.bookId, date:f.date||iso(today()), kind, wallet,
    toWallet: kind==="transfer" ? f.toWallet : undefined,
    amount, note:f.note||undefined, source: kind==="income" ? (f.source||undefined) : undefined,
    bucket:f.bucket||undefined, projectId:f.projectId||undefined, rhythmId:rid
  });
  save(); banner=""; render();
}

const forms = {
  login(f){
    if(f.password===PASSWORD){ authed=true; banner=""; try{sessionStorage.setItem(SESS,"1");}catch(e){} render(); }
    else fail("That password isn’t right.");
  },
  quicklog(f){
    const book = db.books.find(b=>b.kind==="personal")||db.books[0];
    addTxn({bookId:book.id, kind:"expense", wallet:"operating", amount:f.amount, note:f.note, rhythmId:f.rhythmId});
  },
  entry(f){ addTxn(f); },
  addrhythm(f){
    const amount = parseMoney(f.amount);
    if(!f.name || amount<=0) return;
    db.rhythms.push({id:uid(), bookId:f.bookId||db.books[0].id, name:f.name, amount,
      cadence:f.cadence||"weekly", type:f.type||"flexible", start:iso(today()), archived:false});
    save(); render();
  },
  updrhythm(f){
    const r = db.rhythms.find(x=>x.id===f.id);
    if(!r) return;
    const amount = parseMoney(f.amount);
    if(amount>0) r.amount = amount;
    if(f.cadence) r.cadence = f.cadence;
    openIds.delete("edit-"+r.id);
    save(); render();
  },
  fundproj(f){
    const p = db.projects.find(x=>x.id===f.projectId), amount = parseMoney(f.amount);
    if(!p||amount<=0) return;
    if(amount > balances(p.bookId).operating) return fail("Not enough in operating to fund that.");
    db.transactions.push({id:uid(),bookId:p.bookId,date:iso(today()),kind:"transfer",wallet:"operating",toWallet:"operating",amount,note:"Fund "+p.name,projectId:p.id});
    save(); banner=""; render();
  },
  addproj(f){
    if(!f.name) return;
    let rule;
    if(f.ruleType==="ceiling") rule={type:"ceiling",cap:parseMoney(f.cap),months:parseInt(f.months)||3};
    else if(f.ruleType==="fraction") rule={type:"fraction",fraction:parseFloat(f.fraction)||10};
    else rule={type:"save",target:parseMoney(f.target)};
    db.projects.push({id:uid(),bookId:f.bookId,name:f.name,rule,start:iso(today()),endNote:f.endNote||undefined,status:"active"});
    save(); render();
  },
  updatebook(f){
    const b = db.books.find(x=>x.id===f.bookId);
    if(!b) return;
    if(f.name) b.name=f.name;
    if("bufferTarget" in f) b.bufferTarget=parseMoney(f.bufferTarget);
    if("monthlyBurn" in f) b.monthlyBurn=parseMoney(f.monthlyBurn);
    if(f.stage) b.stage=f.stage;
    save(); render();
  },
  addvent(f){
    if(!f.name) return;
    const id = uid();
    db.books.push({id,name:f.name,kind:"venture",stage:"seeded",bufferTarget:parseMoney(f.bufferTarget),monthlyBurn:parseMoney(f.monthlyBurn),seedCeiling:parseMoney(f.seedCeiling)||undefined,seedDeadline:f.seedDeadline||undefined,createdAt:iso(today())});
    const seed = parseMoney(f.seedAmount);
    if(seed>0) db.transactions.push({id:uid(),bookId:id,date:iso(today()),kind:"income",wallet:"operating",amount:seed,source:"Seed capital",note:"Seeded from surplus"});
    save(); go("book:"+id);
  },
  addam(f){
    if(!f.title) return;
    db.amendments.push({id:uid(),date:iso(today()),title:f.title,reason:f.reason||"",status:"pending"});
    save(); render();
  },
  saveconst(f){
    db.constitution = {
      givingPct:parseFloat(f.givingPct)||0, drawAmount:parseMoney(f.drawAmount),
      drawCadence:f.drawCadence||"monthly",
      surplusSplit:{wealth:parseFloat(f.splitWealth)||0,growth:parseFloat(f.splitGrowth)||0,onward:parseFloat(f.splitOnward)||0},
      notes:f.notes||""
    };
    save(); render();
  },
  closemeeting(f){
    const res = (f.resolutions||"").split("\n").map(s=>s.trim()).filter(Boolean);
    db.meetings.push({id:uid(),label:f.label,date:iso(today()),resolutions:res,notes:f.notes||undefined});
    save(); render();
  }
};

const clicks = {
  logout(){ authed=false; banner=""; try{sessionStorage.removeItem(SESS);}catch(e){} render(); },
  entrykind(el){ entryKind = el.dataset.v; render(); },
  deltxn(el){ db.transactions = db.transactions.filter(t=>t.id!==el.dataset.id); save(); render(); },
  delrhythm(el){ const r=db.rhythms.find(x=>x.id===el.dataset.id); if(r){ r.archived=true; save(); render(); } },
  editrhythm(el){ const k="edit-"+el.dataset.id; openIds.has(k)?openIds.delete(k):openIds.add(k); render(); },
  payrhythm(el){
    const r = db.rhythms.find(x=>x.id===el.dataset.id);
    if(!r) return;
    const spent = rhythmSpent(r, periodStart(r.cadence, today()));
    const bk = db.books.find(b=>b.id===r.bookId);
    db.transactions.push({id:uid(),bookId:r.bookId,date:iso(today()),kind:"expense",wallet:"operating",
      amount:Math.max(0,r.amount-spent), note:r.name, rhythmId:r.id,
      bucket: bk && bk.kind==="venture" ? "burn" : undefined});
    save(); render();
  },
  endproj(el){ const p=db.projects.find(x=>x.id===el.dataset.id); if(p){p.status="ended"; save(); render();} },
  decide(el){ const a=db.amendments.find(x=>x.id===el.dataset.id); if(a){ a.status=el.dataset.v; a.decidedAt=iso(today()); save(); render(); } },
  reseed(){ db=demoDb(); save(); go("week"); },
  empty(){ db=emptyDb(); save(); go("week"); }
};

document.addEventListener("submit", e=>{
  const form = e.target.closest("form");
  if(!form) return;
  e.preventDefault();
  const f = {};
  new FormData(form).forEach((v,k)=>{ f[k] = typeof v==="string" ? v.trim() : v; });
  const a = form.dataset.a;
  if(a && forms[a]) return forms[a](f);
  if(f.kind) return addTxn(f);
});
document.addEventListener("click", e=>{
  const g = e.target.closest("[data-go]");
  if(g){ e.preventDefault(); return go(g.dataset.go); }
  const el = e.target.closest("[data-a]");
  if(!el || el.tagName==="FORM") return;
  if(clicks[el.dataset.a]){ e.preventDefault(); clicks[el.dataset.a](el); }
});
document.addEventListener("toggle", e=>{
  const d = e.target;
  if(d.tagName!=="DETAILS" || !d.dataset.id) return;
  if(d.open) openIds.add(d.dataset.id); else openIds.delete(d.dataset.id);
}, true);

/* ============ seed data ============ */
function emptyDb(){
  return {
    books:[{id:"personal",name:"Personal",kind:"personal",bufferTarget:0,createdAt:iso(today())}],
    transactions:[], rhythms:[], projects:[], amendments:[], meetings:[],
    constitution:{givingPct:15,drawAmount:0,drawCadence:"monthly",surplusSplit:{wealth:50,growth:30,onward:20},notes:""}
  };
}
function demoDb(){
  const t = today(), mon = weekStart(t);
  const weeks = [];
  for(let i=6;i>=0;i--) weeks.push(addDays(mon,-i*7));
  const open = iso(addDays(weeks[0],-6));
  const tx = [];
  const push = o => tx.push(Object.assign({id:uid()},o));

  // Rhythms — the set list. Weekly ones sum to $250.
  const R = [
    {id:"r-groc", bookId:"personal", name:"Groceries",            amount:9000,  cadence:"weekly",  type:"flexible"},

    {id:"r-small",bookId:"personal", name:"Coffee & small stuff", amount:5500,  cadence:"weekly",  type:"flexible"},
    {id:"r-din",  bookId:"personal", name:"Dinner out",           amount:4500,  cadence:"weekly",  type:"flexible"},
    {id:"r-rent", bookId:"personal", name:"Rent",                 amount:165000,cadence:"monthly", type:"fixed"},
    {id:"r-give", bookId:"personal", name:"Giving — tithe & offering", amount:60000, cadence:"monthly", type:"fixed"},
    {id:"r-subs", bookId:"personal", name:"Subscriptions",        amount:8900,  cadence:"monthly", type:"fixed"},
    {id:"r-pay",  bookId:"hubway",   name:"Payroll",              amount:250000,cadence:"monthly", type:"fixed"},
    {id:"r-tools",bookId:"hubway",   name:"Tools & software",     amount:40000, cadence:"monthly", type:"fixed"},
    {id:"r-tax",  bookId:"hubway",   name:"Tax set-aside",        amount:180000,cadence:"quarterly",type:"fixed"}
  ].map(r=>Object.assign(r,{start:open, archived:false}));

  // opening balances
  push({bookId:"personal",date:open,kind:"income",wallet:"operating",amount:90000,source:"Opening balance"});
  push({bookId:"personal",date:open,kind:"income",wallet:"buffer",amount:620000,source:"Opening balance"});
  push({bookId:"personal",date:open,kind:"income",wallet:"wealth",amount:1250000,source:"Opening balance"});
  push({bookId:"hubway",date:open,kind:"income",wallet:"operating",amount:140000,source:"Opening balance"});
  push({bookId:"hubway",date:open,kind:"income",wallet:"buffer",amount:510000,source:"Opening balance"});
  push({bookId:"hubway",date:open,kind:"income",wallet:"wealth",amount:300000,source:"Opening balance"});

  const retainers = [210000,185000,240000,95000,260000,175000,230000];
  weeks.forEach((w,i)=> push({bookId:"hubway",date:iso(w),kind:"income",wallet:"operating",amount:retainers[i],source:"Client retainers"}));

  // monthly rhythms actually paid
  const firsts = [];
  let cur = new Date(weeks[0].getFullYear(), weeks[0].getMonth(), 1);
  while(cur <= t){ if(cur >= weeks[0]) firsts.push(new Date(cur)); cur = new Date(cur.getFullYear(),cur.getMonth()+1,1); }
  firsts.forEach(f=>{
    const d = iso(f);
    push({bookId:"personal",date:d,kind:"income",wallet:"operating",amount:400000,source:"The draw"});
    push({bookId:"personal",date:d,kind:"expense",wallet:"operating",amount:165000,note:"Rent",rhythmId:"r-rent"});
    push({bookId:"personal",date:d,kind:"expense",wallet:"operating",amount:60000,note:"Giving",rhythmId:"r-give"});
    push({bookId:"personal",date:d,kind:"expense",wallet:"operating",amount:8900,note:"Subscriptions",rhythmId:"r-subs"});
    push({bookId:"personal",date:d,kind:"transfer",wallet:"operating",toWallet:"buffer",amount:50000,note:"Buffer fill"});
    push({bookId:"personal",date:d,kind:"transfer",wallet:"operating",toWallet:"wealth",amount:40000,note:"Wealth step"});
    push({bookId:"hubway",date:d,kind:"expense",wallet:"operating",amount:250000,note:"Payroll",rhythmId:"r-pay",bucket:"burn"});
    push({bookId:"hubway",date:d,kind:"expense",wallet:"operating",amount:40000,note:"Tools",rhythmId:"r-tools",bucket:"burn"});
    push({bookId:"hubway",date:d,kind:"expense",wallet:"operating",amount:400000,note:"Owner's draw",bucket:"burn"});
    push({bookId:"hubway",date:d,kind:"transfer",wallet:"operating",toWallet:"buffer",amount:120000,note:"Refill buffer"});
  });
  push({bookId:"hubway",date:iso(addDays(weeks[3],2)),kind:"transfer",wallet:"operating",toWallet:"wealth",amount:80000,note:"Surplus → wealth (50%)"});

  // weekly living — dinner out is consistently over its $45 line, so it earns a review
  const groc = [6200,7100,6800,8400,7300,6600,7000];
  const gas  = [6000,6000,6000,6000,6000,6000,6000];
  const small= [3100,4200,3800,5100,4400,3600,2300];
  const dine = [6400,5800,7100,5400,6900,6100,5400];
  weeks.forEach((w,i)=>{
    const days = [1,2,3,4];
    [["r-groc","Groceries",groc[i],0],["r-gas","Gas — fill the tank",gas[i],1],
     ["r-small","Coffee & small stuff",small[i],2],["r-din","Dinner out",dine[i],3]].forEach(x=>{
      const d = addDays(w, x[3]);
      if(d <= t) push({bookId:"personal",date:iso(d),kind:"expense",wallet:"operating",amount:x[2],note:x[1],rhythmId:x[0]});
    });
  });

  // projects
  push({bookId:"personal",date:iso(weeks[2]),kind:"transfer",wallet:"operating",toWallet:"operating",amount:30000,note:"Fund Furnishing",projectId:"proj-furnish"});
  push({bookId:"personal",date:iso(weeks[5]),kind:"transfer",wallet:"operating",toWallet:"operating",amount:30000,note:"Fund Furnishing",projectId:"proj-furnish"});

  push({bookId:"hubway",date:iso(weeks[5]),kind:"expense",wallet:"operating",amount:38000,note:"Ads",bucket:"fuel",projectId:"proj-mkt"});

  const q = Math.floor(t.getMonth()/3)+1, y = t.getFullYear();
  const pq = q===1 ? "Q4 "+(y-1) : "Q"+(q-1)+" "+y;
  const nq = q===4 ? "Q1 "+(y+1) : "Q"+(q+1)+" "+y;

  return {
    books:[
      {id:"personal",name:"Personal",kind:"personal",bufferTarget:1000000,createdAt:open},
      {id:"hubway",name:"Hubway Studio",kind:"venture",stage:"self-funding",bufferTarget:900000,monthlyBurn:300000,seedCeiling:1500000,seedDeadline:"Board meeting "+nq,createdAt:open}
    ],
    transactions:tx, rhythms:R,
    projects:[
      {id:"proj-furnish",bookId:"personal",name:"Furnishing",rule:{type:"save",target:120000},start:iso(weeks[1]),endNote:"When funded and spent",status:"active"},
      {id:"proj-mkt",bookId:"hubway",name:"Marketing push",rule:{type:"ceiling",cap:150000,months:3},start:iso(weeks[1]),endNote:"Board meeting "+nq,status:"active"}

    meetings:[{id:"mt1",label:pq,date:iso(addDays(weeks[0],-1)),resolutions:["Weekly rhythms set at $250 across four lines","Personal buffer target: $10,000","Hubway surplus split 50/30/20 ratified"],notes:"Founding board meeting."}],
